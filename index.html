<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт родительского комитета</title>
<script src="exceljs.min.js"></script>
<style>
  :root {
    --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --border-soft: #f1f5f9;
    --accent: #6366f1; --success: #16a34a; --danger: #dc2626;
    --radius: 12px; --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px -1px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 24px 32px 48px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0; }
  header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .tab-btn { background: transparent; border: none; padding: 8px 16px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: var(--radius-sm); transition: all 0.2s; }
  .tab-btn:hover { background: var(--border-soft); color: var(--text); }
  .tab-btn.active { background: var(--accent); color: #fff; }

  .table-section, .dashboard-section { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }

  .toolbar { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); }
  .search-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 250px; max-width: 500px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search-wrap input {
    width: 100%; padding: 9px 12px 9px 36px; font-size: 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
  .row-count { font-size: 13px; color: var(--muted); margin-left: auto; }
  .row-count.accountant-mode {
    background: #dbeafe;
    color: #1d4ed8;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    letter-spacing: .01em;
  }

  .table-wrapper { overflow-x: auto; width: 100%; max-height: 70vh; }
  table { width: auto; min-width: 100%; border-collapse: collapse; font-size: 14px; }

  thead { position: sticky; top: 0; z-index: 10; }
  th { background: #f8fafc; color: var(--muted); font-weight: 600; text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none; }
  #tableHeadTotals th { background: #f1f5f9; color: var(--text); font-weight: 700; text-transform: none; font-size: 14px; padding: 10px 16px; border-bottom: 2px solid var(--border); }
  #tableHeadTotals th.num { color: var(--success); font-size: 15px; }

  td { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: #f8fafc; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.hidden { display: none !important; }

  tbody tr.row-unpaid { background-color: #fff1f2 !important; }
  tbody tr.row-unpaid:hover { background-color: #ffe4e6 !important; }

  td.cell-unpaid {
    background-color: #fecaca;
    color: var(--danger) !important;
    font-weight: 700;
    box-shadow: inset 3px 0 0 #dc2626;
  }
  tbody tr.row-unpaid:hover td.cell-unpaid {
    background-color: #fca5a5;
  }
  td.cell-unpaid::before {
    content: '×';
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    vertical-align: 1px;
    margin-right: 4px;
    color: #b91c1c;
    opacity: 0.9;
  }

  th.num, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }
  td.zero { color: #cbd5e1; }
  td.negative { color: var(--danger); }
  td.paid { color: var(--success); font-weight: 600; }
  td.unpaid { color: var(--danger); font-weight: 600; }
  td.excused { color: #8b5cf6 !important; font-weight: 600; font-size: 13px; }

  .dashboard-section { padding: 24px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
  .kpi-label { font-size: 13px; color: var(--muted); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px;}
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .kpi-value.green { color: var(--success); }
  .kpi-value.blue { color: var(--accent); }
  .kpi-value.red { color: var(--danger); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .stat-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; }
  .stat-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text); flex-shrink: 0; }

  /* Новый блок «Статус сборов» */
  .status-list { display: flex; flex-direction: column; gap: 16px; }
  .status-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-soft); padding-bottom: 12px; }
  .status-item:last-child { border-bottom: none; padding-bottom: 0; }
  .status-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .status-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .status-value.green { color: var(--success); }
  .status-value.yellow { color: #ca8a04; }
  .status-value.red { color: var(--danger); }

  /* Блок «На что потрачены деньги» */
  .price-list { display: flex; flex-direction: column; gap: 0; max-height: 400px; overflow-y: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .price-list::-webkit-scrollbar { width: 6px; }
  .price-list::-webkit-scrollbar-track { background: transparent; }
  .price-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .price-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  .price-item { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); gap: 16px; }
  .price-item:first-child { padding-top: 0; }
  .price-item:last-child { border-bottom: none; padding-bottom: 0; }
  .price-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); line-height: 1.4; flex: 1; }
  .price-amount { font-size: 15px; font-weight: 700; color: var(--success); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--muted); gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 20px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; margin-top: 20px; word-break: break-word; }

  @media (max-width: 768px) {
    .container { padding: 16px 12px; }
    header { flex-direction: column; }
    .row-count { margin: 8px 0 0; text-align: right; width: 100%; }
    #tableHeadTotals th { font-size: 13px; padding: 8px 12px; }
    .dashboard-section { padding: 16px; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('students')">Мой ребенок</button>
      <button class="tab-btn" onclick="switchTab('stats')">Статистика класса</button>
    </div>

    <div id="tab-students">
      <section class="table-section">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="search" id="search" placeholder="Введите 2+ буквы фамилии..." autocomplete="off">
            </div>
            <span class="row-count" id="rowCount">Список скрыт</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
              <tr id="tableHeadTotals"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-stats" hidden>
      <section class="dashboard-section">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Собрано всего</div>
            <div class="kpi-value green" id="kpi-collected">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Потрачено всего</div>
            <div class="kpi-value blue" id="kpi-spent">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Остаток в кассе</div>
            <div class="kpi-value" id="kpi-balance">0 ₽</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Статус сборов</div>
            <div class="status-list" id="paymentStats"></div>
          </div>
          <div class="stat-card">
            <div class="stat-title">На что потрачены деньги</div>
            <div class="price-list" id="expensesList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   Состояние и константы
   ========================================================================== */
const SECRET_TOKEN = '#all#';
let globalData = { dataRows: [], headerRow: [], numericCols: [], totalCols: 0 };
let hasError = false;

/* ==========================================================================
   Обработчики ошибок и таймаут
   ========================================================================== */
window.addEventListener('error', function (e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});
window.addEventListener('unhandledrejection', function (e) {
  showError('Ошибка загрузки: ' + (e.reason?.message || e.reason || 'неизвестная ошибка'));
});

let abortController = null;
const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (15 сек). Проверьте интернет.');
}, 15000);

function showError(msg) {
  hasError = true;
  clearTimeout(loadTimeout);
  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = true;
  const el = document.getElementById('error');
  el.hidden = false;
  el.innerHTML = '<strong>Не удалось загрузить данные.</strong><br>Проверьте файлы в репозитории.<br><small></small>';
  el.querySelector('small').textContent = msg;
}

function switchTab(tabName) {
  document.getElementById('tab-students').hidden = true;
  document.getElementById('tab-stats').hidden = true;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

  if (tabName === 'students') {
    document.getElementById('tab-students').hidden = false;
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
  } else {
    document.getElementById('tab-stats').hidden = false;
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
  }
}

/* ==========================================================================
   Утилиты
   ========================================================================== */
function safeParseNumber(val) {
  if (typeof val === 'number') return isFinite(val) ? val : 0;
  if (val === null || val === undefined || val === '') return 0;
  if (val instanceof Date) return 0;
  const str = String(val).replace(/[^\d.,-]/g, '').replace(',', '.');
  const num = parseFloat(str);
  return isNaN(num) ? 0 : num;
}

function round2(num) {
  return Math.round(num * 100) / 100;
}

function formatNumber(v) {
  if (typeof v !== 'number' || !isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

function extractCellValue(v) {
  if (v === null || v === undefined) return '';
  const t = typeof v;
  if (t === 'number' || t === 'string' || t === 'boolean') return v;
  if (v instanceof Date) return v;

  if (v.richText) return v.richText.map(r => r.text || '').join('');

  if ('result' in v) {
    const r = v.result;
    if (r === null || r === undefined) return '';
    if (typeof r === 'object') {
      if (r.error) return '';
      if (r.richText) return r.richText.map(x => x.text || '').join('');
    }
    return r;
  }

  if ('error' in v) return '';
  if ('text' in v) return v.text;

  return '';
}

function getCellStatus(cell) {
  try {
    const fill = cell.fill;
    if (!fill || fill.type !== 'pattern' || fill.pattern !== 'solid') return 'debt';

    const fg = fill.fgColor;
    if (!fg) return 'debt';

    let rgb = '';
    if (fg.argb) rgb = String(fg.argb).toUpperCase();

    if (!rgb && fg.indexed !== undefined) {
      const map = { 42: 'C6EFCE', 43: 'FFEB9C', 44: 'FFC7CE' };
      rgb = map[fg.indexed] || '';
    }

    if (!rgb) return 'debt';
    if (rgb.length === 8 && rgb.startsWith('FF')) rgb = rgb.substring(2);

    if (rgb === 'C6EFCE') return 'paid';
    if (rgb === 'FFEB9C' || rgb === 'FFFF00') return 'excused';
    if (rgb === 'FFC7CE') return 'debt';

    return 'debt';
  } catch (e) {
    return 'debt';
  }
}

/* ==========================================================================
   Единая точка подсчёта всех сумм
   ========================================================================== */
function computeTotals() {
  const { dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const totals = new Array(totalCols).fill(0);
  const expenseTotals = {};
  let collected = 0;
  let spent = 0;

  dataRows.forEach(row => {
    const paidVal = safeParseNumber(row[statusColIndex].v);
    totals[statusColIndex] = round2(totals[statusColIndex] + paidVal);
    collected = round2(collected + paidVal);

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status === 'excused') continue;
      const val = safeParseNumber(row[c].v);
      totals[c] = round2(totals[c] + val);
      expenseTotals[c] = round2((expenseTotals[c] || 0) + val);
      spent = round2(spent + val);
    }
  });

  totals[remainingColIndex] = round2(totals[statusColIndex] - spent);

  return { totals, collected, spent, expenseTotals };
}

/* ==========================================================================
   Загрузка и инициализация
   ========================================================================== */
async function init() {
  hasError = false;
  abortController = new AbortController();
  try {
    if (typeof ExcelJS === 'undefined') {
      throw new Error('Библиотека exceljs.min.js не найдена.');
    }

    const resp = await fetch('data.xlsx', { cache: 'no-store', signal: abortController.signal });
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      if (!isNaN(d.getTime())) {
        const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastUpdated').textContent = `Обновлено: ${dateStr} в ${timeStr}`;
      }
    }

    const buf = await resp.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const ws = wb.worksheets[0];
    if (!ws) throw new Error('В файле нет листов');

    const columns = Math.max(1, ws.columnCount || 0);
    const rows = [];

    ws.eachRow({ includeEmpty: false }, (row) => {
      const cells = [];
      for (let c = 1; c <= columns; c++) {
        const cell = row.getCell(c);
        cells.push({
          v: extractCellValue(cell.value),
          status: getCellStatus(cell)
        });
      }
      rows.push(cells);
    });

    if (rows.length === 0) throw new Error('Файл не содержит данных.');

    parseData(rows, columns);

    clearTimeout(loadTimeout);
    if (!hasError) {
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
    if (e.message === 'Failed to fetch') showError('Нет подключения к интернету. Проверьте сеть.');
    else showError(e.message);
  }
}

/* ==========================================================================
   Парсинг
   ========================================================================== */
function parseData(rows, totalCols) {
  if (!rows || rows.length === 0) throw new Error('Файл пуст.');

  const headerRow = rows[0].map(c => c.v);
  const dataRows = [];
  let statusColIndex = -1;
  let remainingColIndex = -1;

  headerRow.forEach((title, idx) => {
    const t = String(title || '').toLowerCase();
    if (t.includes('сдал') || t.includes('оплата') || t.includes('взнос')) statusColIndex = idx;
    if (t.includes('остаток') || t.includes('долг')) remainingColIndex = idx;
  });

  if (statusColIndex === -1) throw new Error('В шапке не найден столбец «Сдали»');
  if (remainingColIndex === -1) throw new Error('В шапке не найден столбец «Остаток»');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;

    const name = String(r[0].v || '').trim();
    if (!name) continue;

    const lower = name.toLowerCase();
    if (lower.startsWith('итог') || lower === 'всего' || lower === 'общий') continue;
    if (!/[а-яёa-z]/i.test(name)) continue;

    dataRows.push(r);
  }

  if (dataRows.length === 0) throw new Error('Не найдено строк с именами детей.');

  const numericCols = [];
  for (let c = 1; c < totalCols; c++) {
    let hasNum = false;
    for (const row of dataRows) {
      if (typeof row[c].v === 'number') { hasNum = true; break; }
      if (typeof row[c].v === 'string' && /\d/.test(row[c].v)) { hasNum = true; break; }
    }
    if (hasNum) numericCols.push(c);
  }

  globalData = { dataRows, headerRow, numericCols, totalCols, statusColIndex, remainingColIndex };

  renderTable();
  renderStats();

  const searchInput = document.getElementById('search');
  if (!searchInput.dataset.listenerAttached) {
    searchInput.addEventListener('input', filterRows);
    searchInput.dataset.listenerAttached = '1';
  }
  filterRows();
}

/* ==========================================================================
   Отрисовка таблицы
   ========================================================================== */
function renderTable() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { totals } = computeTotals();

  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }
  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    if (numericSet.has(c)) {
      th.classList.add('num');
      th.textContent = formatNumber(totals[c]);
    }
    theadTotals.appendChild(th);
  }

  const fragment = document.createDocumentFragment();

  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden');

    let isRowUnpaid = false;
    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === remainingColIndex) continue;
      if (row[c].status === 'debt' && safeParseNumber(row[c].v) > 0) {
        isRowUnpaid = true;
        break;
      }
    }
    if (isRowUnpaid) tr.classList.add('row-unpaid');

    const childPaid = safeParseNumber(row[statusColIndex].v);
    let childSpent = 0;
    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status !== 'excused') {
        childSpent = round2(childSpent + safeParseNumber(row[c].v));
      }
    }
    const childBalance = round2(childPaid - childSpent);

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const isNum = numericSet.has(c);

      if (!isNum) {
        const s = row[c].v === '' || row[c].v == null ? '—' : String(row[c].v);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
        tr.appendChild(td);
        continue;
      }

      td.classList.add('num');

      if (c === remainingColIndex) {
        if (Math.abs(childBalance) < 0.01) {
          td.textContent = '—';
          td.classList.add('zero');
        } else {
          td.textContent = formatNumber(childBalance);
          if (childBalance < 0) td.classList.add('negative');
        }
        tr.appendChild(td);
        continue;
      }

      const val = safeParseNumber(row[c].v);
      const status = row[c].status;

      if (status === 'excused') {
        td.textContent = String(row[c].v || 'б/н');
        td.classList.add('excused');
      } else if (val === 0) {
        td.textContent = '—';
        td.classList.add('zero');
        if (c === statusColIndex) td.classList.add('unpaid');
      } else {
        td.textContent = formatNumber(val);
        if (val < 0) td.classList.add('negative');
        if (c === statusColIndex) {
          td.classList.add('paid');
        } else if (c > 2 && status === 'debt') {
          td.classList.add('cell-unpaid');
        }
      }

      tr.appendChild(td);
    }
    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment);
}

/* ==========================================================================
   Дашборд
   ========================================================================== */
function renderStats() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { collected, spent, expenseTotals } = computeTotals();
  const balance = round2(collected - spent);
  const studentsCount = Math.max(1, dataRows.length);

  document.getElementById('kpi-collected').textContent = formatNumber(collected) + ' ₽';
  document.getElementById('kpi-spent').textContent = formatNumber(spent) + ' ₽';

  const balanceEl = document.getElementById('kpi-balance');
  balanceEl.textContent = formatNumber(balance) + ' ₽';
  balanceEl.classList.toggle('red', balance < 0);

  // Статус сборов
  let fullyPaid = 0, partiallyPaid = 0, notPaid = 0;

  dataRows.forEach(row => {
    let hasAnyPayment = safeParseNumber(row[statusColIndex].v) > 0;
    let hasDebt = false;

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status === 'excused') continue;

      const val = safeParseNumber(row[c].v);
      if (val <= 0) continue;
      if (row[c].status === 'paid') hasAnyPayment = true;
      else if (row[c].status === 'debt') hasDebt = true;
    }

    if (!hasDebt) fullyPaid++;
    else if (hasAnyPayment) partiallyPaid++;
    else notPaid++;
  });

  document.getElementById('paymentStats').innerHTML = `
    <div class="status-item">
      <span class="status-label">Сдали всё</span>
      <span class="status-value green">${fullyPaid} чел.</span>
    </div>
    <div class="status-item">
      <span class="status-label">Сдали частично</span>
      <span class="status-value yellow">${partiallyPaid} чел.</span>
    </div>
    <div class="status-item">
      <span class="status-label">Пока не сдавали</span>
      <span class="status-value red">${notPaid} чел.</span>
    </div>
  `;

  // Расходы по категориям
  const expensesEl = document.getElementById('expensesList');
  expensesEl.innerHTML = '';
  let hasExpenses = false;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    const totalAmount = expenseTotals[c] || 0;
    if (totalAmount <= 0) continue;

    hasExpenses = true;
    const div = document.createElement('div');
    div.className = 'price-item';

    const nameEl = document.createElement('span');
    nameEl.className = 'price-name';
    nameEl.textContent = headerRow[c] || `Колонка ${c + 1}`;

    const amountEl = document.createElement('span');
    amountEl.className = 'price-amount';
    amountEl.textContent = formatNumber(totalAmount) + ' ₽';

    div.appendChild(nameEl);
    div.appendChild(amountEl);
    expensesEl.appendChild(div);
  }

  if (!hasExpenses) {
    expensesEl.innerHTML = '<div style="color:var(--muted); font-size:14px;">Расходов пока нет</div>';
  }
}

/* ==========================================================================
   Поиск и режим бухгалтера
   ========================================================================== */
function filterRows() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const rowCountEl = document.getElementById('rowCount');
  const rows = document.querySelectorAll('#tableBody tr');

  if (SECRET_TOKEN && q === SECRET_TOKEN.toLowerCase()) {
    rows.forEach(tr => tr.classList.remove('hidden'));
    rowCountEl.textContent = `Все записи (${rows.length})`;
    rowCountEl.classList.add('accountant-mode');
    return;
  }

  rowCountEl.classList.remove('accountant-mode');

  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    rowCountEl.textContent = 'Список скрыт';
    return;
  }

  let found = 0;
  rows.forEach(tr => {
    const nameCell = tr.cells[0];
    if (nameCell && nameCell.textContent.toLowerCase().includes(q)) {
      tr.classList.remove('hidden');
      found++;
    } else {
      tr.classList.add('hidden');
    }
  });

  rowCountEl.textContent = found > 0 ? `Найдено: ${found}` : 'Не найдено';
}

init();
