<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
<title>Отчёт родительского комитета</title>

<!-- ExcelJS — чтение xlsx с сохранением цветов заливки -->
<script src="exceljs.min.js"></script>

<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --border: #e5e9f0; --border-soft: #eef2f7;
    --accent: #6366f1; --success: #16a34a; --danger: #dc2626;
    --input-bg: #ffffff; --seg-bg: #eceef4;
    --row-hover: #f8fafc; --row-unpaid: #fff1f2;
    --cell-unpaid-bg: #fecaca; --cell-unpaid-mark: #b91c1c;
    --head-bg: rgba(255,255,255,.86);
    --err-bg: #fef2f2; --err-border: #fecaca; --err-text: #991b1b;
    --dot-amber: #d97706; --paid: #15803d;
    --radius: 14px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 6px 18px -8px rgba(15,23,42,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --card: #111a2e; --text: #e6eaf3; --muted: #8b98b4;
      --border: #1f2a40; --border-soft: #1a2438;
      --accent: #818cf8; --success: #4ade80; --danger: #f87171;
      --input-bg: #0d1526; --seg-bg: #0d1526;
      --row-hover: #16203686; --row-unpaid: #43141c;
      --cell-unpaid-bg: #5c1a24; --cell-unpaid-mark: #fca5a5;
      --head-bg: rgba(17,26,46,.88);
      --err-bg: #2b1218; --err-border: #7f1d1d; --err-text: #fecaca;
      --dot-amber: #fbbf24; --paid: #4ade80;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow: 0 1px 3px rgba(0,0,0,.5), 0 8px 24px -10px rgba(0,0,0,.55);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  ::selection { background: rgba(99,102,241,.22); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 18px 12px 40px; }

  header { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: clamp(19px, 5vw, 24px); font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0; }

  /* --- табы-сегмент --- */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--seg-bg); border-radius: 12px; padding: 4px; }
  .tab-btn {
    flex: 1; min-height: 44px; padding: 8px 14px; border: none; border-radius: 9px;
    font-size: 15px; font-weight: 600; color: var(--muted); background: transparent; cursor: pointer;
    transition: color .18s, background .18s, box-shadow .18s; font-family: inherit;
  }
  .tab-btn.active { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }

  .table-section, .dashboard-section {
    background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
    box-shadow: var(--shadow); overflow: hidden;
  }

  .toolbar { padding: 14px 14px 12px; border-bottom: 1px solid var(--border-soft); }
  .search-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1 1 100%; min-width: 0; }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--muted); pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 12px 16px 12px 40px; font-size: 16px;
    border: 1.5px solid transparent; border-radius: 999px;
    background: var(--input-bg); color: var(--text); font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
    appearance: none; -webkit-appearance: none;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus {
    outline: none; border-color: var(--accent); background: var(--card);
    box-shadow: 0 0 0 4px rgba(99,102,241,.14);
  }

  .row-count { font-size: 13px; color: var(--muted); margin-left: auto; }
  .row-count.accountant-mode {
    background: rgba(99,102,241,.12); color: var(--accent); font-weight: 700;
    padding: 4px 12px; border-radius: 999px; letter-spacing: .01em;
  }

  /* --- таблица --- */
  .table-wrapper {
    overflow-x: auto; width: 100%; max-height: 70vh;
    max-height: calc(100dvh - 210px);
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .table-wrapper::-webkit-scrollbar { height: 8px; }
  .table-wrapper::-webkit-scrollbar-track { background: transparent; }
  .table-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  table { width: auto; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }

  thead th {
    position: sticky; top: 0; z-index: 10;
    background: var(--head-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--muted); font-weight: 600; text-align: left; vertical-align: bottom;
    padding: 10px 12px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    border-bottom: 1px solid var(--border); white-space: normal; user-select: none;
  }
  #tableHeadTotals th {
    background: var(--head-bg); color: var(--text); font-weight: 700; text-transform: none;
    font-size: 13px; padding: 9px 12px; border-bottom: 2px solid var(--border);
  }
  #tableHeadTotals th.num { color: var(--success); font-size: 14px; }

  td { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.hidden { display: none !important; }

  /* липкая колонка ФИО: непрозрачная, с переносом вместо обрезки */
  tbody td:first-child {
    position: sticky; left: 0; z-index: 1;
    background: var(--card); border-right: 1px solid var(--border-soft);
    min-width: 9.5em; max-width: 14em;
    white-space: normal; overflow-wrap: break-word; word-break: break-word;
    box-shadow: 2px 0 8px -6px rgba(15,23,42,.14);
  }
  thead th:first-child {
    position: sticky; left: 0; z-index: 12;
    background: var(--head-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-right: 1px solid var(--border);
    min-width: 9.5em; max-width: 14em;
  }

  tbody tr.row-unpaid { background: var(--row-unpaid); }
  tbody tr.row-unpaid:hover { background: var(--row-unpaid); filter: brightness(1.02); }
  tbody tr.row-unpaid td:first-child { background: var(--row-unpaid); }

  td.cell-unpaid {
    background: var(--cell-unpaid-bg);
    color: var(--danger) !important; font-weight: 700;
    box-shadow: inset 3px 0 0 var(--danger);
  }
  tbody tr.row-unpaid:hover td.cell-unpaid { background: var(--cell-unpaid-bg); }
  td.cell-unpaid::before {
    content: '×'; display: inline-block; font-size: 12px; font-weight: 800;
    line-height: 1; vertical-align: 1px; margin-right: 4px;
    color: var(--cell-unpaid-mark); opacity: .9;
  }

  tbody tr:hover { background: var(--row-hover); }
  tbody tr.row-unpaid:hover td.cell-unpaid { background: var(--cell-unpaid-bg); }
  th.num, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }

  td.zero { color: var(--muted); opacity: .55; }
  td.negative { color: var(--danger); }
  td.paid { color: var(--paid); font-weight: 600; }
  td.unpaid { color: var(--danger); font-weight: 600; }
  td.excused { color: #8b5cf6 !important; font-weight: 600; font-size: 12.5px; }
  @media (prefers-color-scheme: dark) { td.excused { color: #a78bfa !important; } }

  /* --- статистика --- */
  .dashboard-section { padding: 18px 14px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow-sm);
  }
  .kpi-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600;
    margin-bottom: 8px; letter-spacing: .04em; display: flex; align-items: center; gap: 7px;
  }
  .kpi-label::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .kpi-card:nth-child(1) .kpi-label::before { background: var(--success); }
  .kpi-card:nth-child(2) .kpi-label::before { background: var(--accent); }
  .kpi-card:nth-child(3) .kpi-label::before { background: var(--dot-amber); }
  .kpi-value { font-size: clamp(22px, 6vw, 30px); font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi-value.green { color: var(--success); }
  .kpi-value.blue { color: var(--accent); }
  .kpi-value.red { color: var(--danger); }

  .stats-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
  }
  .stat-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; }

  .status-list { display: flex; flex-direction: column; gap: 14px; }
  .status-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-soft); padding-bottom: 11px; }
  .status-item:last-child { border-bottom: none; padding-bottom: 0; }
  .status-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .status-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .status-value.green { color: var(--success); }
  .status-value.yellow { color: #ca8a04; }
  .status-value.red { color: var(--danger); }
  @media (prefers-color-scheme: dark) { .status-value.yellow { color: #fbbf24; } }

  .price-list {
    display: flex; flex-direction: column; max-height: 400px; overflow-y: auto;
    padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .price-list::-webkit-scrollbar { width: 6px; }
  .price-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .price-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); }
  .price-item:first-child { padding-top: 0; }
  .price-item:last-child { border-bottom: none; padding-bottom: 0; }
  .price-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); line-height: 1.4; flex: 1; min-width: 0; overflow-wrap: break-word; }
  .price-amount { font-size: 15px; font-weight: 700; color: var(--success); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .empty { color: var(--muted); font-size: 14px; padding: 4px 0; }

  /* --- загрузка / ошибка --- */
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--muted); gap: 16px; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    background: conic-gradient(var(--accent), transparent 65%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 0);
    mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 0);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text);
    padding: 18px; border-radius: var(--radius); font-size: 14px; line-height: 1.6;
    margin-top: 18px; word-break: break-word;
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .tab-btn, input, tbody tr { transition: none; }
  }

  /* --- десктоп-слой --- */
  @media (min-width: 768px) {
    .container { padding: 28px 32px 56px; }
    header { margin-bottom: 24px; }
    .tabs { width: max-content; margin-bottom: 20px; }
    .tab-btn { flex: initial; min-height: 40px; padding: 9px 22px; }
    .toolbar { padding: 16px 20px; }
    .search-wrap { flex: 1; max-width: 440px; }
    .search-wrap input { padding: 11px 16px 11px 40px; font-size: 14px; }
    table { font-size: 14px; }
    thead th { padding: 12px 16px; font-size: 12px; }
    #tableHeadTotals th { font-size: 14px; padding: 10px 16px; }
    td { padding: 12px 16px; }
    .dashboard-section { padding: 24px; }
    .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { padding: 20px; transition: transform .18s, box-shadow .18s; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stats-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .stat-card { padding: 24px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="students" role="tab" aria-selected="true">Мой ребенок</button>
      <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false">Статистика класса</button>
    </div>

    <div id="tab-students" role="tabpanel">
      <section class="table-section">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="search" id="search" placeholder="Введите 2+ буквы фамилии..." autocomplete="off" spellcheck="false" aria-label="Поиск по фамилии">
            </div>
            <span class="row-count" id="rowCount" aria-live="polite">Список скрыт</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
              <tr id="tableHeadTotals"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-stats" hidden role="tabpanel">
      <section class="dashboard-section">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Собрано всего</div>
            <div class="kpi-value green" id="kpi-collected">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Потрачено всего</div>
            <div class="kpi-value blue" id="kpi-spent">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Остаток в кассе</div>
            <div class="kpi-value" id="kpi-balance">0 ₽</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Статус сборов</div>
            <div class="status-list" id="paymentStats"></div>
          </div>
          <div class="stat-card">
            <div class="stat-title">На что потрачены деньги</div>
            <div class="price-list" id="expensesList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
'use strict';

/* ==========================================================================
   1. СОСТОЯНИЕ
   ========================================================================== */

const SECRET_TOKEN = '#all#';

let globalData = {
  dataRows: [],
  headerRow: [],
  numericCols: [],
  totalCols: 0,
  statusColIndex: -1,
  remainingColIndex: -1
};

/* Кэш итогов. Пересчитывается ТОЛЬКО в parseData(). */
let globalTotals = {
  totals: [],
  collected: 0,
  spent: 0,
  expenseTotals: {}
};

let hasError = false;
let abortController = null;

/* ==========================================================================
   2. ОШИБКИ И ТАЙМАУТ
   ========================================================================== */

window.addEventListener('error', function (e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});

window.addEventListener('unhandledrejection', function (e) {
  const reason = e.reason;
  const msg = (reason && reason.message) || String(reason) || 'неизвестная ошибка';
  showError('Ошибка загрузки: ' + msg);
});

const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (15 сек). Проверьте интернет.');
}, 15000);

function showError(msg) {
  if (hasError) return;
  hasError = true;
  clearTimeout(loadTimeout);

  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = true;

  const el = document.getElementById('error');
  el.hidden = false;
  el.innerHTML = '<strong>Не удалось загрузить данные.</strong><br>Проверьте файлы в репозитории.<br><small></small>';
  el.querySelector('small').textContent = String(msg || 'неизвестная ошибка');
}

/* ==========================================================================
   3. ВКЛАДКИ
   ========================================================================== */

const VALID_TABS = ['students', 'stats'];

function switchTab(tabName) {
  if (VALID_TABS.indexOf(tabName) === -1) return;

  document.getElementById('tab-students').hidden = true;
  document.getElementById('tab-stats').hidden = true;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.setAttribute('aria-selected', 'false');
  });

  const activeBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.setAttribute('aria-selected', 'true');
  }

  if (tabName === 'students') {
    document.getElementById('tab-students').hidden = false;
  } else {
    document.getElementById('tab-stats').hidden = false;
  }
}

/* ==========================================================================
   4. УТИЛИТЫ
   ========================================================================== */

function safeParseNumber(val) {
  if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
  if (val === null || val === undefined || val === '') return 0;
  if (Object.prototype.toString.call(val) === '[object Date]') return 0;

  let s = String(val).replace(/[^\d.,-]/g, '');
  if (!s) return 0;

  const lastDot = s.lastIndexOf('.');
  const lastComma = s.lastIndexOf(',');

  if (lastDot >= 0 && lastComma >= 0) {
    if (lastDot > lastComma) {
      s = s.replace(/,/g, '');
    } else {
      s = s.replace(/\./g, '').replace(',', '.');
    }
  } else if (lastComma >= 0) {
    s = s.replace(',', '.');
  }

  const num = parseFloat(s);
  return Number.isFinite(num) ? num : 0;
}

function round2(num) {
  if (!Number.isFinite(num)) return 0;
  return Math.round(num * 100) / 100;
}

function formatNumber(v) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

function extractCellValue(v) {
  if (v === null || v === undefined) return '';
  const t = typeof v;
  if (t === 'number' || t === 'string' || t === 'boolean') return v;
  if (Object.prototype.toString.call(v) === '[object Date]') return v;

  if (v.richText) return v.richText.map(r => r.text || '').join('');

  if ('result' in v) {
    const r = v.result;
    if (r === null || r === undefined) return '';
    if (typeof r === 'object') {
      if (r.error) return '';
      if (r.richText) return r.richText.map(x => x.text || '').join('');
    }
    return r;
  }

  if ('error' in v) return '';
  if ('text' in v) return v.text;
  return '';
}

function getCellStatus(cell) {
  try {
    const fill = cell.fill;
    if (!fill || fill.type !== 'pattern' || fill.pattern !== 'solid') return 'debt';

    const fg = fill.fgColor;
    if (!fg) return 'debt';

    let rgb = '';
    if (fg.argb) rgb = String(fg.argb).toUpperCase();

    if (!rgb && fg.indexed !== undefined) {
      const map = { 42: 'C6EFCE', 43: 'FFEB9C', 44: 'FFC7CE' };
      rgb = map[fg.indexed] || '';
    }

    if (!rgb) return 'debt';
    if (rgb.length === 8 && rgb.startsWith('FF')) rgb = rgb.substring(2);

    if (rgb === 'C6EFCE') return 'paid';
    if (rgb === 'FFEB9C' || rgb === 'FFFF00') return 'excused';
    if (rgb === 'FFC7CE') return 'debt';
    return 'debt';
  } catch (e) {
    return 'debt';
  }
}

function isDebtCell(row, c) {
  return row[c].status === 'debt' && safeParseNumber(row[c].v) > 0;
}

/* ==========================================================================
   5. РАСЧЁТЫ
   ========================================================================== */

function computeTotals() {
  const { dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const totals = new Array(totalCols).fill(0);
  const expenseTotals = {};
  let collected = 0;
  let spent = 0;

  dataRows.forEach(row => {
    const paidVal = safeParseNumber(row[statusColIndex].v);
    totals[statusColIndex] = round2(totals[statusColIndex] + paidVal);
    collected = round2(collected + paidVal);

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status === 'excused') continue;

      const val = safeParseNumber(row[c].v);
      totals[c] = round2(totals[c] + val);
      expenseTotals[c] = round2((expenseTotals[c] || 0) + val);
      spent = round2(spent + val);
    }
  });

  totals[remainingColIndex] = round2(totals[statusColIndex] - spent);

  return { totals, collected, spent, expenseTotals };
}

function computeChildStats(row) {
  const { numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const childPaid = safeParseNumber(row[statusColIndex].v);
  let hasAnyPayment = childPaid > 0;
  let hasDebt = false;
  let childSpent = 0;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    if (row[c].status === 'excused') continue;

    const val = safeParseNumber(row[c].v);
    childSpent = round2(childSpent + val);

    if (val > 0) {
      if (row[c].status === 'paid') hasAnyPayment = true;
      else if (row[c].status === 'debt') hasDebt = true;
    }
  }

  return {
    childPaid,
    childSpent,
    childBalance: round2(childPaid - childSpent),
    hasAnyPayment,
    hasDebt
  };
}

/* ==========================================================================
   6. ЗАГРУЗКА
   ========================================================================== */

async function init() {
  hasError = false;
  abortController = new AbortController();

  try {
    if (typeof ExcelJS === 'undefined') {
      throw new Error('Библиотека exceljs.min.js не найдена.');
    }

    const resp = await fetch('data.xlsx', { cache: 'no-store', signal: abortController.signal });
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      if (!isNaN(d.getTime())) {
        const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastUpdated').textContent = 'Обновлено: ' + dateStr + ' в ' + timeStr;
      }
    }

    const buf = await resp.arrayBuffer();
    clearTimeout(loadTimeout);

    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);

    const ws = wb.worksheets[0];
    if (!ws) throw new Error('В файле нет листов');

    const columns = Math.max(1, ws.columnCount || 0);
    const rows = [];

    ws.eachRow({ includeEmpty: false }, (row) => {
      const cells = [];
      for (let c = 1; c <= columns; c++) {
        const cell = row.getCell(c);
        cells.push({
          v: extractCellValue(cell.value),
          status: getCellStatus(cell)
        });
      }
      rows.push(cells);
    });

    if (rows.length === 0) throw new Error('Файл не содержит данных.');

    parseData(rows, columns);

    if (!hasError) {
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
    }
  } catch (e) {
    clearTimeout(loadTimeout);
    if (e && e.name === 'AbortError') return;
    if (e && e.message === 'Failed to fetch') {
      showError('Нет подключения к интернету. Проверьте сеть.');
    } else {
      showError((e && e.message) || String(e) || 'неизвестная ошибка');
    }
  }
}

/* ==========================================================================
   7. ПАРСИНГ
   ========================================================================== */

function parseData(rows, totalCols) {
  if (!rows || rows.length === 0) throw new Error('Файл пуст.');

  const headerRow = rows[0].map(c => c.v);
  const dataRows = [];

  let statusColIndex = -1;
  let remainingColIndex = -1;

  headerRow.forEach((title, idx) => {
    const t = String(title || '').toLowerCase();
    if (t.includes('сдал') || t.includes('оплата') || t.includes('взнос')) statusColIndex = idx;
    if (t.includes('остаток') || t.includes('долг')) remainingColIndex = idx;
  });

  if (statusColIndex === -1) throw new Error('В шапке не найден столбец «Сдали»');
  if (remainingColIndex === -1) throw new Error('В шапке не найден столбец «Остаток»');
  if (statusColIndex === 0) throw new Error('Столбец «Сдали» не может быть первым — там ФИО');
  if (remainingColIndex === 0) throw new Error('Столбец «Остаток» не может быть первым — там ФИО');
  if (statusColIndex === remainingColIndex) throw new Error('Столбцы «Сдали» и «Остаток» совпадают — проверьте шапку');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;

    const name = String(r[0].v || '').trim();
    if (!name) continue;

    const lower = name.toLowerCase();
    if (lower.startsWith('итог') || lower === 'всего' || lower === 'общий') continue;
    if (!/[а-яёa-z]/i.test(name)) continue;

    dataRows.push(r);
  }

  if (dataRows.length === 0) throw new Error('Не найдено строк с именами детей.');

  const numericCols = [];
  for (let c = 1; c < totalCols; c++) {
    let hasNum = false;
    for (const row of dataRows) {
      if (typeof row[c].v === 'number') { hasNum = true; break; }
      if (typeof row[c].v === 'string' && /\d/.test(row[c].v)) { hasNum = true; break; }
    }
    if (hasNum) numericCols.push(c);
  }

  globalData = { dataRows, headerRow, numericCols, totalCols, statusColIndex, remainingColIndex };

  globalTotals = computeTotals();

  renderTable();
  renderStats();

  const searchInput = document.getElementById('search');
  if (!searchInput.dataset.listenerAttached) {
    searchInput.addEventListener('input', filterRows);
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterRows();
      }
    });
    searchInput.dataset.listenerAttached = '1';
  }
  filterRows();
}

/* ==========================================================================
   8. ТАБЛИЦА
   ========================================================================== */

function renderTable() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { totals } = globalTotals;

  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    if (numericSet.has(c) || c === statusColIndex || c === remainingColIndex) {
      th.classList.add('num');
      th.textContent = formatNumber(totals[c] || 0);
    }
    theadTotals.appendChild(th);
  }

  const fragment = document.createDocumentFragment();

  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden');

    const stats = computeChildStats(row);
    if (stats.hasDebt) tr.classList.add('row-unpaid');

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const isNum = numericSet.has(c);

      if (!isNum) {
        const s = row[c].v === '' || row[c].v == null ? '—' : String(row[c].v);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
        tr.appendChild(td);
        continue;
      }

      td.classList.add('num');

      if (c === remainingColIndex) {
        if (Math.abs(stats.childBalance) < 0.01) {
          td.textContent = '—';
          td.classList.add('zero');
        } else {
          td.textContent = formatNumber(stats.childBalance);
          if (stats.childBalance < 0) td.classList.add('negative');
        }
        tr.appendChild(td);
        continue;
      }

      const val = safeParseNumber(row[c].v);
      const status = row[c].status;

      if (status === 'excused') {
        td.textContent = String(row[c].v || 'б/н');
        td.classList.add('excused');
      } else if (val === 0) {
        td.textContent = '—';
        td.classList.add('zero');
        if (c === statusColIndex) td.classList.add('unpaid');
      } else {
        td.textContent = formatNumber(val);
        if (val < 0) td.classList.add('negative');
        if (c === statusColIndex) {
          td.classList.add('paid');
        } else if (c > 2 && isDebtCell(row, c)) {
          td.classList.add('cell-unpaid');
        }
      }

      tr.appendChild(td);
    }

    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment);
}

/* ==========================================================================
   9. ДАШБОРД
   ========================================================================== */

function renderStats() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { collected, spent, expenseTotals } = globalTotals;
  const balance = round2(collected - spent);

  document.getElementById('kpi-collected').textContent = formatNumber(collected) + ' ₽';
  document.getElementById('kpi-spent').textContent = formatNumber(spent) + ' ₽';

  const balanceEl = document.getElementById('kpi-balance');
  balanceEl.textContent = formatNumber(balance) + ' ₽';
  balanceEl.classList.toggle('red', balance < 0);

  let fullyPaid = 0, partiallyPaid = 0, notPaid = 0;

  dataRows.forEach(row => {
    const stats = computeChildStats(row);
    if (!stats.hasDebt) fullyPaid++;
    else if (stats.hasAnyPayment) partiallyPaid++;
    else notPaid++;
  });

  document.getElementById('paymentStats').innerHTML =
    '<div class="status-item">' +
      '<span class="status-label">Сдали всё</span>' +
      '<span class="status-value green">' + fullyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Сдали частично</span>' +
      '<span class="status-value yellow">' + partiallyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Пока не сдавали</span>' +
      '<span class="status-value red">' + notPaid + ' чел.</span>' +
    '</div>';

  const expensesEl = document.getElementById('expensesList');
  expensesEl.innerHTML = '';
  let hasExpenses = false;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    const totalAmount = expenseTotals[c] || 0;
    if (totalAmount <= 0) continue;

    hasExpenses = true;
    const div = document.createElement('div');
    div.className = 'price-item';

    const nameEl = document.createElement('span');
    nameEl.className = 'price-name';
    nameEl.textContent = headerRow[c] || ('Колонка ' + (c + 1));

    const amountEl = document.createElement('span');
    amountEl.className = 'price-amount';
    amountEl.textContent = formatNumber(totalAmount) + ' ₽';

    div.appendChild(nameEl);
    div.appendChild(amountEl);
    expensesEl.appendChild(div);
  }

  if (!hasExpenses) {
    expensesEl.innerHTML = '<div class="empty">Расходов пока нет</div>';
  }
}

/* ==========================================================================
   10. ПОИСК
   ========================================================================== */

function filterRows() {
  const input = document.getElementById('search');
  const q = input.value.trim().toLowerCase();
  const rowCountEl = document.getElementById('rowCount');
  const rows = document.querySelectorAll('#tableBody tr');

  if (SECRET_TOKEN && q === SECRET_TOKEN.toLowerCase()) {
    rows.forEach(tr => tr.classList.remove('hidden'));
    rowCountEl.textContent = 'Все записи (' + rows.length + ')';
    rowCountEl.classList.add('accountant-mode');
    return;
  }

  rowCountEl.classList.remove('accountant-mode');

  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    rowCountEl.textContent = 'Список скрыт';
    return;
  }

  let found = 0;
  rows.forEach(tr => {
    const nameCell = tr.cells[0];
    if (nameCell && nameCell.textContent.toLowerCase().includes(q)) {
      tr.classList.remove('hidden');
      found++;
    } else {
      tr.classList.add('hidden');
    }
  });

  rowCountEl.textContent = found > 0 ? ('Найдено: ' + found) : 'Не найдено';
}

/* ==========================================================================
   11. ПРИВЯЗКА ВКЛАДОК
   ========================================================================== */

document.querySelectorAll('.tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    switchTab(btn.dataset.tab);
  });
});

/* ==========================================================================
   12. СТАРТ
   ========================================================================== */

init();
</script>
