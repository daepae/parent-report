<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Отчёт родительского комитета</title>

<!-- ExcelJS — чтение xlsx с сохранением цветов заливки -->
<script src="exceljs.min.js"></script>

<style>
  /* ============ ДИЗАЙН v3: токены, 2 темы, мобильный-first ============ */
  :root {
    --bg:#0b1020; --panel:#121826; --panel-2:#0f1522; --elev:#1b2334;
    --border:rgba(148,163,184,.14); --border-strong:rgba(148,163,184,.28);
    --text:#e6eaf3; --muted:#8b93a7; --accent:#818cf8;
    --accent-soft:rgba(129,140,248,.14); --accent-ring:rgba(129,140,248,.30);
    --paid:#4ade80; --paid-bg:rgba(74,222,128,.07);
    --excused:#fbbf24; --excused-bg:rgba(251,191,36,.07);
    --debt-text:#f2a3a3; --debt-bg:rgba(248,113,113,.09); --debt-row:rgba(248,113,113,.05);
    --debt-row-solid:#1e1a21; --debt-stripe:rgba(248,113,113,.50);
    --zero:#98a2b3; --shadow:0 10px 30px rgba(3,7,18,.45);
    --thead-glass:rgba(18,24,38,.78);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f4f6fb; --panel:#ffffff; --panel-2:#eef1f8; --elev:#ffffff;
      --border:rgba(15,23,42,.10); --border-strong:rgba(15,23,42,.22);
      --text:#101828; --muted:#667085; --accent:#6366f1;
      --accent-soft:rgba(99,102,241,.10); --accent-ring:rgba(99,102,241,.25);
      --paid:#15803d; --paid-bg:#e9f7ef;
      --excused:#b45309; --excused-bg:#fbf3dd;
      --debt-text:#b42318; --debt-bg:#fdeee9; --debt-row:#fbf2f1;
      --debt-row-solid:#fbf4f3; --debt-stripe:rgba(180,35,24,.45);
      --zero:#98a2b3; --shadow:0 10px 30px rgba(15,23,42,.07);
      --thead-glass:rgba(255,255,255,.80);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; color:var(--text);
    background-color:var(--bg);
    background-image:linear-gradient(180deg, var(--accent-soft), transparent 260px);
    background-repeat:no-repeat;
    font:15px/1.45 -apple-system, 'Segoe UI', Roboto, Inter, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .container { max-width:1120px; margin:0 auto; padding:20px 16px 48px; }
  h1 { margin:0; font-size:clamp(21px,5vw,26px); font-weight:800; letter-spacing:-.02em; }
  .subtitle { margin:5px 0 0; color:var(--muted); font-size:13px; }

  .loading { text-align:center; padding:48px 16px; color:var(--muted); }
  .spinner { width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
    background:conic-gradient(var(--accent) 0 25%, transparent 0 100%);
    -webkit-mask:radial-gradient(farthest-side, transparent 55%, #000 56%);
    mask:radial-gradient(farthest-side, transparent 55%, #000 56%);
    animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
  .error { padding:14px 16px; border:1px solid var(--border-strong);
    border-left:3px solid var(--debt-stripe); border-radius:14px;
    background:var(--debt-bg); color:var(--debt-text); }

  .tabs { display:flex; gap:4px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:999px; padding:4px; margin:18px 0 14px; }
  .tab-btn { flex:1; min-height:44px; border:0; border-radius:999px; background:transparent;
    color:var(--muted); font:inherit; font-size:15px; font-weight:600; cursor:pointer;
    transition:background .18s, color .18s; }
  .tab-btn.active { background:var(--elev); color:var(--text);
    box-shadow:0 2px 10px rgba(3,7,18,.30); }

  .toolbar { background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:12px; margin-bottom:12px; }
  .search-row { display:flex; align-items:center; gap:10px; }
  .search-wrap { position:relative; flex:1; min-width:0; }
  .search-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--muted); pointer-events:none; }
  #search { width:100%; min-height:44px; padding:10px 40px 10px 42px; font:inherit; font-size:16px;
    color:var(--text); background:var(--panel-2); border:1px solid var(--border);
    border-radius:999px; outline:none; transition:border-color .18s, box-shadow .18s, background .18s; }
  #search:focus { background:var(--accent-soft); border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-ring); }
  .row-count { flex:none; font-size:12px; color:var(--muted); white-space:nowrap; }
  .row-count.accountant-mode { color:var(--accent); font-weight:600; }

  .table-wrapper { background:var(--panel); border:1px solid var(--border);
    border-radius:14px; overflow:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    max-height:calc(100vh - 220px); min-height:180px; scrollbar-width:thin; }
  @supports (height:100dvh) { .table-wrapper { max-height:calc(100dvh - 220px); } }
  .table-wrapper::-webkit-scrollbar { height:8px; width:8px; }
  .table-wrapper::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:8px; }
  .table-wrapper::-webkit-scrollbar-track { background:transparent; }
  #dataTable { border-collapse:separate; border-spacing:0; width:100%; }
  #dataTable th { position:sticky; top:0; z-index:2; text-align:left; font-size:11px;
    font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    padding:10px 12px; background:var(--thead-glass);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); white-space:normal; }
  #dataTable th:first-child { position:sticky; left:0; z-index:4;
    background:var(--panel); -webkit-backdrop-filter:none; backdrop-filter:none;
    box-shadow:inset -1px 0 0 var(--border), 2px 0 6px -3px rgba(3,7,18,.45); }
  #dataTable td { padding:11px 12px; border-bottom:1px solid var(--border);
    background:var(--panel); white-space:nowrap; }
  #dataTable td:first-child { position:sticky; left:0; z-index:1; background:var(--panel);
    box-shadow:inset -1px 0 0 var(--border), 2px 0 6px -3px rgba(3,7,18,.45); }
  #dataTable td.num { font-variant-numeric:tabular-nums; }
  tr.hidden { display:none; }

  #dataTable td.paid { color:var(--paid); }
  #dataTable td.excused { color:var(--excused); background:var(--excused-bg); }
  #dataTable td.zero { color:var(--zero); }
  #dataTable td.unpaid { color:var(--debt-text); background:var(--debt-bg);
    border-radius:8px; font-weight:600; }
  #dataTable td.negative { color:var(--debt-text); }
  #dataTable td.cell-unpaid { color:var(--debt-text); background:var(--debt-bg); font-weight:600; }
  tr.row-unpaid td { background:var(--debt-row); }
  tr.row-unpaid td:first-child { background:var(--debt-row-solid);
    box-shadow:inset -1px 0 0 var(--border), inset 3px 0 0 var(--debt-stripe), 2px 0 6px -3px rgba(3,7,18,.45); }

  .kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .kpi-card { background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:14px; box-shadow:var(--shadow); }
  .kpi-label { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600;
    text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; }
  .kpi-label::before { content:''; width:8px; height:8px; border-radius:50%; flex:none; }
  .kpi-card:nth-child(1) .kpi-label::before { background:var(--paid); }
  .kpi-card:nth-child(2) .kpi-label::before { background:var(--accent); }
  .kpi-card:nth-child(3) .kpi-label::before { background:var(--excused); }
  .kpi-value { font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums;
    white-space:nowrap; font-size:min(5vw, 30px); }
  .kpi-value.green { color:var(--paid); }
  .kpi-value.blue { color:var(--accent); }
  .kpi-value.red { color:var(--debt-text); }

  .stats-grid { display:grid; grid-template-columns:1fr; gap:12px; margin-top:12px; }
  .stat-card { background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; box-shadow:var(--shadow); }
  .stat-title { font-size:16px; font-weight:700; margin-bottom:6px; }
  .status-item { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--border); }
  .status-item:last-child { border-bottom:0; }
  .status-label { color:var(--muted); text-transform:uppercase; font-size:12px;
    letter-spacing:.04em; }
  .status-value { font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .status-value.green { color:var(--paid); }
  .status-value.yellow { color:var(--excused); }
  .status-value.red { color:var(--debt-text); }
  .status-value.blue { color:var(--accent); }

  .price-item { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--border); }
  .price-item:last-child { border-bottom:0; }
  .price-name { color:var(--text); min-width:0; }
  .price-amount { color:var(--paid); font-weight:600; white-space:nowrap;
    font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); font-size:14px; padding:6px 0; }

  @media (min-width: 768px) {
    .container { padding:28px 24px 56px; }
    #dataTable th { white-space:nowrap; }
    .kpi-grid { grid-template-columns:repeat(3, 1fr); gap:16px; }
    .kpi-value { font-size:30px; }
    .stats-grid { grid-template-columns:1fr 1fr; gap:16px; }
    .toolbar { padding:14px 16px; }
    .search-wrap { max-width:460px; }
  }

  :focus-visible { outline:none; box-shadow:0 0 0 3px var(--accent-ring); border-radius:10px; }
  ::selection { background:var(--accent-ring); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="students" role="tab" aria-selected="true">Мой ребенок</button>
      <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false">Статистика класса</button>
    </div>

    <div id="tab-students" role="tabpanel">
      <section class="table-section">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="search" id="search" placeholder="Введите 2+ буквы фамилии..." autocomplete="off" spellcheck="false" aria-label="Поиск по фамилии">
            </div>
            <span class="row-count" id="rowCount" aria-live="polite">Список скрыт</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
              <tr id="tableHeadTotals"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-stats" hidden role="tabpanel">
      <section class="dashboard-section">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Собрано всего</div>
            <div class="kpi-value green" id="kpi-collected">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Потрачено всего</div>
            <div class="kpi-value blue" id="kpi-spent">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Остаток в кассе</div>
            <div class="kpi-value" id="kpi-balance">0 ₽</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Статус сборов</div>
            <div class="status-list" id="paymentStats"></div>
          </div>
          <div class="stat-card">
            <div class="stat-title">На что потрачены деньги</div>
            <div class="price-list" id="expensesList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
'use strict';

/* ==========================================================================
   1. СОСТОЯНИЕ
   ========================================================================== */

const SECRET_TOKEN = '#all#';

let globalData = {
  dataRows: [],
  headerRow: [],
  numericCols: [],
  totalCols: 0,
  statusColIndex: -1,
  remainingColIndex: -1
};

/* Кэш итогов. Пересчитывается ТОЛЬКО в parseData(). */
let globalTotals = {
  totals: [],
  collected: 0,
  spent: 0,
  expenseTotals: {}
};

let hasError = false;
let abortController = null;

/* ==========================================================================
   2. ОШИБКИ И ТАЙМАУТ
   ========================================================================== */

window.addEventListener('error', function (e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});

window.addEventListener('unhandledrejection', function (e) {
  const reason = e.reason;
  const msg = (reason && reason.message) || String(reason) || 'неизвестная ошибка';
  showError('Ошибка загрузки: ' + msg);
});

const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (15 сек). Проверьте интернет.');
}, 15000);

function showError(msg) {
  if (hasError) return;
  hasError = true;
  clearTimeout(loadTimeout);

  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = true;

  const el = document.getElementById('error');
  el.hidden = false;
  el.innerHTML = '<strong>Не удалось загрузить данные.</strong><br>Проверьте файлы в репозитории.<br><small></small>';
  el.querySelector('small').textContent = String(msg || 'неизвестная ошибка');
}

/* ==========================================================================
   3. ВКЛАДКИ
   ========================================================================== */

const VALID_TABS = ['students', 'stats'];

function switchTab(tabName) {
  if (VALID_TABS.indexOf(tabName) === -1) return;

  document.getElementById('tab-students').hidden = true;
  document.getElementById('tab-stats').hidden = true;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.setAttribute('aria-selected', 'false');
  });

  const activeBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.setAttribute('aria-selected', 'true');
  }

  if (tabName === 'students') {
    document.getElementById('tab-students').hidden = false;
  } else {
    document.getElementById('tab-stats').hidden = false;
  }
}

/* ==========================================================================
   4. УТИЛИТЫ
   ========================================================================== */

function safeParseNumber(val) {
  if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
  if (val === null || val === undefined || val === '') return 0;
  if (Object.prototype.toString.call(val) === '[object Date]') return 0;

  let s = String(val).replace(/[^\d.,-]/g, '');
  if (!s) return 0;

  const lastDot = s.lastIndexOf('.');
  const lastComma = s.lastIndexOf(',');

  if (lastDot >= 0 && lastComma >= 0) {
    if (lastDot > lastComma) {
      s = s.replace(/,/g, '');
    } else {
      s = s.replace(/\./g, '').replace(',', '.');
    }
  } else if (lastComma >= 0) {
    s = s.replace(',', '.');
  }

  const num = parseFloat(s);
  return Number.isFinite(num) ? num : 0;
}

function round2(num) {
  if (!Number.isFinite(num)) return 0;
  return Math.round(num * 100) / 100;
}

function formatNumber(v) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

function extractCellValue(v) {
  if (v === null || v === undefined) return '';
  const t = typeof v;
  if (t === 'number' || t === 'string' || t === 'boolean') return v;
  if (Object.prototype.toString.call(v) === '[object Date]') return v;

  if (v.richText) return v.richText.map(r => r.text || '').join('');

  if ('result' in v) {
    const r = v.result;
    if (r === null || r === undefined) return '';
    if (typeof r === 'object') {
      if (r.error) return '';
      if (r.richText) return r.richText.map(x => x.text || '').join('');
    }
    return r;
  }

  if ('error' in v) return '';
  if ('text' in v) return v.text;
  return '';
}

function getCellStatus(cell) {
  try {
    const fill = cell.fill;
    if (!fill || fill.type !== 'pattern' || fill.pattern !== 'solid') return 'debt';

    const fg = fill.fgColor;
    if (!fg) return 'debt';

    let rgb = '';
    if (fg.argb) rgb = String(fg.argb).toUpperCase();

    if (!rgb && fg.indexed !== undefined) {
      const map = { 42: 'C6EFCE', 43: 'FFEB9C', 44: 'FFC7CE' };
      rgb = map[fg.indexed] || '';
    }

    if (!rgb) return 'debt';
    if (rgb.length === 8 && rgb.startsWith('FF')) rgb = rgb.substring(2);

    if (rgb === 'C6EFCE') return 'paid';
    if (rgb === 'FFEB9C' || rgb === 'FFFF00') return 'excused';
    if (rgb === 'FFC7CE') return 'debt';
    return 'debt';
  } catch (e) {
    return 'debt';
  }
}

function isDebtCell(row, c) {
  return row[c].status === 'debt' && safeParseNumber(row[c].v) > 0;
}

/* ==========================================================================
   5. РАСЧЁТЫ
   ========================================================================== */

function computeTotals() {
  const { dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const totals = new Array(totalCols).fill(0);
  const expenseTotals = {};
  let collected = 0;
  let spent = 0;

  dataRows.forEach(row => {
    const paidVal = safeParseNumber(row[statusColIndex].v);
    totals[statusColIndex] = round2(totals[statusColIndex] + paidVal);
    collected = round2(collected + paidVal);

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status === 'excused') continue;

      const val = safeParseNumber(row[c].v);
      totals[c] = round2(totals[c] + val);
      expenseTotals[c] = round2((expenseTotals[c] || 0) + val);
      spent = round2(spent + val);
    }
  });

  totals[remainingColIndex] = round2(totals[statusColIndex] - spent);

  return { totals, collected, spent, expenseTotals };
}

function computeChildStats(row) {
  const { numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const childPaid = safeParseNumber(row[statusColIndex].v);
  let hasAnyPayment = childPaid > 0;
  let hasDebt = false;
  let childSpent = 0;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    if (row[c].status === 'excused') continue;

    const val = safeParseNumber(row[c].v);
    childSpent = round2(childSpent + val);

    if (val > 0) {
      if (row[c].status === 'paid') hasAnyPayment = true;
      else if (row[c].status === 'debt') hasDebt = true;
    }
  }

  return {
    childPaid,
    childSpent,
    childBalance: round2(childPaid - childSpent),
    hasAnyPayment,
    hasDebt
  };
}

/* ==========================================================================
   6. ЗАГРУЗКА
   ========================================================================== */

async function init() {
  hasError = false;
  abortController = new AbortController();

  try {
    if (typeof ExcelJS === 'undefined') {
      throw new Error('Библиотека exceljs.min.js не найдена.');
    }

    const resp = await fetch('data.xlsx', { cache: 'no-store', signal: abortController.signal });
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      if (!isNaN(d.getTime())) {
        const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastUpdated').textContent = 'Обновлено: ' + dateStr + ' в ' + timeStr;
      }
    }

    const buf = await resp.arrayBuffer();
    clearTimeout(loadTimeout);

    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);

    const ws = wb.worksheets[0];
    if (!ws) throw new Error('В файле нет листов');

    const columns = Math.max(1, ws.columnCount || 0);
    const rows = [];

    ws.eachRow({ includeEmpty: false }, (row) => {
      const cells = [];
      for (let c = 1; c <= columns; c++) {
        const cell = row.getCell(c);
        cells.push({
          v: extractCellValue(cell.value),
          status: getCellStatus(cell)
        });
      }
      rows.push(cells);
    });

    if (rows.length === 0) throw new Error('Файл не содержит данных.');

    parseData(rows, columns);

    if (!hasError) {
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
    }
  } catch (e) {
    clearTimeout(loadTimeout);
    if (e && e.name === 'AbortError') return;
    if (e && e.message === 'Failed to fetch') {
      showError('Нет подключения к интернету. Проверьте сеть.');
    } else {
      showError((e && e.message) || String(e) || 'неизвестная ошибка');
    }
  }
}

/* ==========================================================================
   7. ПАРСИНГ
   ========================================================================== */

function parseData(rows, totalCols) {
  if (!rows || rows.length === 0) throw new Error('Файл пуст.');

  const headerRow = rows[0].map(c => c.v);
  const dataRows = [];

  let statusColIndex = -1;
  let remainingColIndex = -1;

  headerRow.forEach((title, idx) => {
    const t = String(title || '').toLowerCase();
    if (t.includes('сдал') || t.includes('оплата') || t.includes('взнос')) statusColIndex = idx;
    if (t.includes('остаток') || t.includes('долг')) remainingColIndex = idx;
  });

  if (statusColIndex === -1) throw new Error('В шапке не найден столбец «Сдали»');
  if (remainingColIndex === -1) throw new Error('В шапке не найден столбец «Остаток»');
  if (statusColIndex === 0) throw new Error('Столбец «Сдали» не может быть первым — там ФИО');
  if (remainingColIndex === 0) throw new Error('Столбец «Остаток» не может быть первым — там ФИО');
  if (statusColIndex === remainingColIndex) throw new Error('Столбцы «Сдали» и «Остаток» совпадают — проверьте шапку');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;

    const name = String(r[0].v || '').trim();
    if (!name) continue;

    const lower = name.toLowerCase();
    if (lower.startsWith('итог') || lower === 'всего' || lower === 'общий') continue;
    if (!/[а-яёa-z]/i.test(name)) continue;

    dataRows.push(r);
  }

  if (dataRows.length === 0) throw new Error('Не найдено строк с именами детей.');

  const numericCols = [];
  for (let c = 1; c < totalCols; c++) {
    let hasNum = false;
    for (const row of dataRows) {
      if (typeof row[c].v === 'number') { hasNum = true; break; }
      if (typeof row[c].v === 'string' && /\d/.test(row[c].v)) { hasNum = true; break; }
    }
    if (hasNum) numericCols.push(c);
  }

  globalData = { dataRows, headerRow, numericCols, totalCols, statusColIndex, remainingColIndex };

  globalTotals = computeTotals();

  renderTable();
  renderStats();

  const searchInput = document.getElementById('search');
  if (!searchInput.dataset.listenerAttached) {
    searchInput.addEventListener('input', filterRows);
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterRows();
      }
    });
    searchInput.dataset.listenerAttached = '1';
  }
  filterRows();
}

/* ==========================================================================
   8. ТАБЛИЦА
   ========================================================================== */

function renderTable() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { totals } = globalTotals;

  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    if (numericSet.has(c) || c === statusColIndex || c === remainingColIndex) {
      th.classList.add('num');
      th.textContent = formatNumber(totals[c] || 0);
    }
    theadTotals.appendChild(th);
  }

  const fragment = document.createDocumentFragment();

  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden');

    const stats = computeChildStats(row);
    if (stats.hasDebt) tr.classList.add('row-unpaid');

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const isNum = numericSet.has(c);

      if (!isNum) {
        const s = row[c].v === '' || row[c].v == null ? '—' : String(row[c].v);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
        tr.appendChild(td);
        continue;
      }

      td.classList.add('num');

      if (c === remainingColIndex) {
        if (Math.abs(stats.childBalance) < 0.01) {
          td.textContent = '—';
          td.classList.add('zero');
        } else {
          td.textContent = formatNumber(stats.childBalance);
          if (stats.childBalance < 0) td.classList.add('negative');
        }
        tr.appendChild(td);
        continue;
      }

      const val = safeParseNumber(row[c].v);
      const status = row[c].status;

      if (status === 'excused') {
        td.textContent = String(row[c].v || 'б/н');
        td.classList.add('excused');
      } else if (val === 0) {
        td.textContent = '—';
        td.classList.add('zero');
        if (c === statusColIndex) td.classList.add('unpaid');
      } else {
        td.textContent = formatNumber(val);
        if (val < 0) td.classList.add('negative');
        if (c === statusColIndex) {
          td.classList.add('paid');
        } else if (c > 2 && isDebtCell(row, c)) {
          td.classList.add('cell-unpaid');
        }
      }

      tr.appendChild(td);
    }

    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment);
}

/* ==========================================================================
   9. ДАШБОРД
   ========================================================================== */

function renderStats() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { collected, spent, expenseTotals } = globalTotals;
  const balance = round2(collected - spent);

  document.getElementById('kpi-collected').textContent = formatNumber(collected) + ' ₽';
  document.getElementById('kpi-spent').textContent = formatNumber(spent) + ' ₽';

  const balanceEl = document.getElementById('kpi-balance');
  balanceEl.textContent = formatNumber(balance) + ' ₽';
  balanceEl.classList.toggle('red', balance < 0);

  let fullyPaid = 0, partiallyPaid = 0, notPaid = 0;

  dataRows.forEach(row => {
    const stats = computeChildStats(row);
    if (!stats.hasDebt) fullyPaid++;
    else if (stats.hasAnyPayment) partiallyPaid++;
    else notPaid++;
  });

  document.getElementById('paymentStats').innerHTML =
    '<div class="status-item">' +
      '<span class="status-label">Сдали всё</span>' +
      '<span class="status-value green">' + fullyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Сдали частично</span>' +
      '<span class="status-value yellow">' + partiallyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Пока не сдавали</span>' +
      '<span class="status-value red">' + notPaid + ' чел.</span>' +
    '</div>';

  const expensesEl = document.getElementById('expensesList');
  expensesEl.innerHTML = '';
  let hasExpenses = false;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    const totalAmount = expenseTotals[c] || 0;
    if (totalAmount <= 0) continue;

    hasExpenses = true;
    const div = document.createElement('div');
    div.className = 'price-item';

    const nameEl = document.createElement('span');
    nameEl.className = 'price-name';
    nameEl.textContent = headerRow[c] || ('Колонка ' + (c + 1));

    const amountEl = document.createElement('span');
    amountEl.className = 'price-amount';
    amountEl.textContent = formatNumber(totalAmount) + ' ₽';

    div.appendChild(nameEl);
    div.appendChild(amountEl);
    expensesEl.appendChild(div);
  }

  if (!hasExpenses) {
    expensesEl.innerHTML = '<div class="empty">Расходов пока нет</div>';
  }
}

/* ==========================================================================
   10. ПОИСК
   ========================================================================== */

function filterRows() {
  const input = document.getElementById('search');
  const q = input.value.trim().toLowerCase();
  const rowCountEl = document.getElementById('rowCount');
  const rows = document.querySelectorAll('#tableBody tr');

  if (SECRET_TOKEN && q === SECRET_TOKEN.toLowerCase()) {
    rows.forEach(tr => tr.classList.remove('hidden'));
    rowCountEl.textContent = 'Все записи (' + rows.length + ')';
    rowCountEl.classList.add('accountant-mode');
    return;
  }

  rowCountEl.classList.remove('accountant-mode');

  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    rowCountEl.textContent = 'Список скрыт';
    return;
  }

  let found = 0;
  rows.forEach(tr => {
    const nameCell = tr.cells[0];
    if (nameCell && nameCell.textContent.toLowerCase().includes(q)) {
      tr.classList.remove('hidden');
      found++;
    } else {
      tr.classList.add('hidden');
    }
  });

  rowCountEl.textContent = found > 0 ? ('Найдено: ' + found) : 'Не найдено';
}

/* ==========================================================================
   11. ПРИВЯЗКА ВКЛАДОК
   ========================================================================== */

document.querySelectorAll('.tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    switchTab(btn.dataset.tab);
  });
});

/* ==========================================================================
   12. СТАРТ
   ========================================================================== */

init();
</script>
