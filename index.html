<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Отчёт родительского комитета</title>

<!-- ExcelJS — чтение xlsx с сохранением цветов заливки -->
<script src="exceljs.min.js"></script>

<style>
  /* ============================================================
     parent-report · design layer (approved) + header multi-line
     Обе темы на одних токенах; ADR-003 цел: JS решает «что», CSS «как».
     ============================================================ */

  :root {
    --bg: #070b14;
    --bg-img:
      radial-gradient(900px 520px at 12% -8%, rgba(79,70,229,.20), transparent 60%),
      radial-gradient(820px 500px at 88% 4%, rgba(124,58,237,.14), transparent 62%),
      linear-gradient(180deg, #0a0f1d 0%, #070b14 55%, #060910 100%);
    --grad-text: linear-gradient(92deg, #f1f4fb 0%, #a5b4fc 60%, #c4b5fd 100%);
    --card: rgba(19,26,44,.66);
    --card-solid: #131a2c;
    --text: #e6eaf4;
    --muted: #8fa0bd;
    --border: rgba(148,163,184,.16);
    --border-soft: rgba(148,163,184,.09);
    --accent: #818cf8;
    --accent-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --success: #4ade80;
    --blue: #7dd3fc;
    --danger: #f87171;
    --yellow: #fbbf24;
    --row-bg: #121a2b;
    --row-hover: #182238;
    --th-bg: #0e1524;
    --row-debt: #1e1520;
    --row-debt-hover: #251a27;
    --debt-cell: #2c1a24;
    --debt-text: #f2a3a3;
    --excused: #cfa473;
    --zero: #55617d;
    --input-bg: rgba(9,14,27,.65);
    --dot-ring: rgba(74,222,128,.16);
    --select: rgba(99,102,241,.4);
    --focus: rgba(129,140,248,.55);
    --scroll: #2c3757;
    --err-bg: rgba(248,113,113,.07);
    --err-border: rgba(248,113,113,.22);
    --err-text: #fca5a5;
    --row-count-accent-bg: rgba(129,140,248,.16);
    --row-count-accent-fg: #b3bcfb;
    --glow: 0 6px 22px rgba(99,102,241,.35);
    --shadow-sm: 0 6px 18px rgba(2,6,18,.30);
    --shadow: 0 16px 44px rgba(2,6,18,.42);
    --col-shadow: 10px 0 16px -10px rgba(0,0,0,.55);
    --radius: 16px; --radius-sm: 12px;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef2fb;
      --bg-img:
        radial-gradient(900px 520px at 12% -8%, rgba(99,102,241,.10), transparent 60%),
        radial-gradient(820px 500px at 88% 4%, rgba(139,92,246,.08), transparent 62%),
        linear-gradient(180deg, #f4f7fe 0%, #eef2fb 60%, #e9eef9 100%);
      --grad-text: linear-gradient(92deg, #1e293b 0%, #4338ca 60%, #6d28d9 100%);
      --card: rgba(255,255,255,.72);
      --card-solid: #ffffff;
      --text: #0f172a;
      --muted: #5c6a85;
      --border: rgba(15,23,42,.10);
      --border-soft: rgba(15,23,42,.06);
      --accent: #4f46e5;
      --accent-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --success: #15803d;
      --blue: #0369a1;
      --danger: #dc2626;
      --yellow: #b45309;
      --row-bg: #ffffff;
      --row-hover: #f3f6fd;
      --th-bg: #f6f8fd;
      --row-debt: #fdf0f2;
      --row-debt-hover: #fbe7ea;
      --debt-cell: #fde3e6;
      --debt-text: #b42318;
      --excused: #9a6b2f;
      --zero: #9aa6bd;
      --input-bg: #ffffff;
      --dot-ring: rgba(21,128,61,.14);
      --select: rgba(79,70,229,.25);
      --focus: rgba(79,70,229,.45);
      --scroll: #c3cbe0;
      --err-bg: #fef2f2;
      --err-border: #fecaca;
      --err-text: #991b1b;
      --row-count-accent-bg: #e0e7ff;
      --row-count-accent-fg: #3730a3;
      --glow: 0 6px 18px rgba(79,70,229,.22);
      --shadow-sm: 0 2px 8px rgba(15,23,42,.06);
      --shadow: 0 12px 32px rgba(15,23,42,.10);
      --col-shadow: 10px 0 14px -10px rgba(15,23,42,.18);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-color: var(--bg);
    background-image: var(--bg-img);
    background-attachment: fixed;
    min-height: 100dvh;
  }
  [hidden] { display: none !important; }
  ::selection { background: var(--select); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

  .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 28px 32px 56px; }

  header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
  h1 { font-size: clamp(20px, 4.5vw, 24px); font-weight: 800; margin: 0 0 6px; letter-spacing: -.02em; line-height: 1.2; color: var(--text); }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    h1 { background-image: var(--grad-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0; display: inline-flex; align-items: center; gap: 8px; }
  .subtitle::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--dot-ring); }

  /* --- табы-пилюли --- */
  .tabs { display: inline-flex; gap: 6px; padding: 6px; margin-bottom: 22px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .tab-btn { background: transparent; border: none; padding: 10px 22px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 999px; transition: color .2s, background .2s, box-shadow .2s; font-family: inherit; }
  .tab-btn:hover { background: var(--border-soft); color: var(--text); }
  .tab-btn.active { background: var(--accent-grad); color: #fff; box-shadow: var(--glow); }

  /* --- секции: стекло --- */
  .table-section, .dashboard-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; }
  .dashboard-section { padding: 24px; }

  /* --- поиск --- */
  .toolbar { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); }
  .search-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 250px; max-width: 520px; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search-wrap input {
    width: 100%; padding: 11px 16px 11px 40px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--input-bg); color: var(--text); font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input::placeholder { color: var(--muted); opacity: .8; }
  .search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }

  .row-count { font-size: 12px; color: var(--muted); margin-left: auto; letter-spacing: .02em; white-space: nowrap; }
  .row-count.accountant-mode { background: var(--row-count-accent-bg); color: var(--row-count-accent-fg); font-weight: 700; padding: 4px 12px; border-radius: 999px; letter-spacing: .01em; }

  /* --- таблица: числа всегда на непрозрачном --- */
  .table-wrapper { overflow-x: auto; width: 100%; max-height: min(70vh, 70dvh); overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  .table-wrapper::-webkit-scrollbar { height: 8px; }
  .table-wrapper::-webkit-scrollbar-track { background: transparent; }
  .table-wrapper::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; font-variant-numeric: tabular-nums; }

  thead { position: sticky; top: 0; z-index: 10; }
  th { background: var(--th-bg); color: var(--muted); font-weight: 700; text-align: left; padding: 12px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; user-select: none; vertical-align: bottom; box-shadow: inset 0 -1px 0 var(--border); }

  /* ПРАВКА: названия столбцов переносятся на несколько строк,
     длинные не растягивают колонки */
  #tableHead th { white-space: normal; max-width: 11em; overflow-wrap: break-word; }
  #tableHeadTotals th { background: var(--th-bg); color: var(--text); font-weight: 800; font-size: 14px; padding: 10px 14px; white-space: nowrap; vertical-align: middle; box-shadow: inset 0 -2px 0 var(--border); }
  #tableHeadTotals th.num { color: var(--success); font-size: 15px; }

  td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; background: var(--row-bg); }
  tbody tr { transition: background-color .12s; }
  tbody tr:hover td { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.hidden { display: none !important; }

  /* --- строка должника: мягкий тинт, полоска у ФИО, сильная заливка только на ячейке долга --- */
  tbody tr.row-unpaid td { background: var(--row-debt); }
  tbody tr.row-unpaid:hover td { background: var(--row-debt-hover); }
  td:first-child { box-shadow: inset -1px 0 0 var(--border-soft), var(--col-shadow); }
  tbody tr.row-unpaid td:first-child { box-shadow: inset 3px 0 0 var(--danger), inset -1px 0 0 var(--border-soft), var(--col-shadow); }
  th:first-child { box-shadow: inset -1px 0 0 var(--border-soft), inset 0 -1px 0 var(--border); }
  th:first-child, td:first-child { position: sticky; left: 0; }
  th:first-child { z-index: 12; }
  td:first-child { z-index: 5; }

  td.cell-unpaid { background: var(--debt-cell) !important; color: var(--debt-text) !important; font-weight: 800; }
  tbody tr.row-unpaid:hover td.cell-unpaid { background: var(--debt-cell) !important; }
  td.cell-unpaid::before { content: '×'; display: inline-block; font-size: 12px; font-weight: 800; line-height: 1; vertical-align: 1px; margin-right: 4px; color: var(--debt-text); opacity: .9; }

  th.num, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  td.zero { color: var(--zero); }
  td.negative { color: var(--danger); font-weight: 600; }
  td.paid { color: var(--success); font-weight: 600; }
  td.unpaid { color: var(--danger); font-weight: 700; }
  td.excused { color: var(--excused) !important; font-weight: 600; font-size: 13px; }

  /* --- дашборд --- */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .kpi-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent-grad); opacity: .85; }
  .kpi-label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; letter-spacing: .06em; }
  .kpi-value { font-size: clamp(20px, 5vw, 28px); font-weight: 800; letter-spacing: -.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kpi-value.green { color: var(--success); }
  .kpi-value.blue { color: var(--blue); }
  .kpi-value.red { color: var(--danger); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .stat-title { font-size: 13px; font-weight: 800; margin-bottom: 16px; color: var(--text); flex-shrink: 0; text-transform: uppercase; letter-spacing: .06em; }

  .status-list { display: flex; flex-direction: column; gap: 14px; }
  .status-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-soft); padding-bottom: 12px; }
  .status-item:last-child { border-bottom: none; padding-bottom: 0; }
  .status-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .status-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .status-value.green { color: var(--success); }
  .status-value.yellow { color: var(--yellow); }
  .status-value.red { color: var(--danger); }

  .price-list { display: flex; flex-direction: column; max-height: 400px; overflow-y: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  .price-list::-webkit-scrollbar { width: 6px; }
  .price-list::-webkit-scrollbar-track { background: transparent; }
  .price-list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  .price-list::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .price-item { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); gap: 16px; }
  .price-item:first-child { padding-top: 0; }
  .price-item:last-child { border-bottom: none; padding-bottom: 0; }
  .price-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); line-height: 1.4; flex: 1; }
  .price-amount { font-size: 15px; font-weight: 700; color: var(--success); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* --- загрузка/ошибка --- */
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--muted); gap: 16px; }
  .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @supports ((mask-image: radial-gradient(#000 55%, transparent 56%)) or (-webkit-mask-image: radial-gradient(#000 55%, transparent 56%))) {
    .spinner {
      border: none;
      background: conic-gradient(from 0deg, transparent 0deg 270deg, var(--accent) 270deg 360deg);
      -webkit-mask-image: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
      mask-image: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 2.5px));
    }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text); padding: 20px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; margin-top: 20px; word-break: break-word; }
  .empty { color: var(--muted); font-size: 14px; padding: 2px 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  @media (max-width: 768px) {
    .container { padding: 18px 12px 40px; }
    header { flex-direction: column; }
    .tabs { width: 100%; }
    .tab-btn { flex: 1; min-height: 44px; padding: 10px 14px; }
    .search-wrap { max-width: none; min-width: 0; }
    .search-wrap input { min-height: 44px; }
    .row-count { margin: 6px 0 0; width: 100%; text-align: right; }
    #tableHead th { font-size: 11px; padding: 10px 10px; }
    #tableHeadTotals th { font-size: 13px; padding: 8px 10px; }
    td { padding: 12px 10px; }
    /* ФИО: узкая колонка с переносом на мобильном */
    td:first-child, #tableHead th:first-child { white-space: normal; overflow-wrap: break-word; max-width: 8.5em; }
    .dashboard-section { padding: 16px; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="students" role="tab" aria-selected="true">Мой ребенок</button>
      <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false">Статистика класса</button>
    </div>

    <div id="tab-students" role="tabpanel">
      <section class="table-section">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="search" id="search" placeholder="Введите 2+ буквы фамилии..." autocomplete="off" spellcheck="false" aria-label="Поиск по фамилии">
            </div>
            <span class="row-count" id="rowCount" aria-live="polite">Список скрыт</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
              <tr id="tableHeadTotals"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-stats" hidden role="tabpanel">
      <section class="dashboard-section">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Собрано всего</div>
            <div class="kpi-value green" id="kpi-collected">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Потрачено всего</div>
            <div class="kpi-value blue" id="kpi-spent">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Остаток в кассе</div>
            <div class="kpi-value" id="kpi-balance">0 ₽</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Статус сборов</div>
            <div class="status-list" id="paymentStats"></div>
          </div>
          <div class="stat-card">
            <div class="stat-title">На что потрачены деньги</div>
            <div class="price-list" id="expensesList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
'use strict';

/* ==========================================================================
   1. СОСТОЯНИЕ
   ========================================================================== */

const SECRET_TOKEN = '#all#';

let globalData = {
  dataRows: [],
  headerRow: [],
  numericCols: [],
  totalCols: 0,
  statusColIndex: -1,
  remainingColIndex: -1
};

/* Кэш итогов. Пересчитывается ТОЛЬКО в parseData(). */
let globalTotals = {
  totals: [],
  collected: 0,
  spent: 0,
  expenseTotals: {}
};

let hasError = false;
let abortController = null;

/* ==========================================================================
   2. ОШИБКИ И ТАЙМАУТ
   ========================================================================== */

window.addEventListener('error', function (e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});

window.addEventListener('unhandledrejection', function (e) {
  const reason = e.reason;
  const msg = (reason && reason.message) || String(reason) || 'неизвестная ошибка';
  showError('Ошибка загрузки: ' + msg);
});

const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (15 сек). Проверьте интернет.');
}, 15000);

function showError(msg) {
  if (hasError) return;
  hasError = true;
  clearTimeout(loadTimeout);

  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = true;

  const el = document.getElementById('error');
  el.hidden = false;
  el.innerHTML = '<strong>Не удалось загрузить данные.</strong><br>Проверьте файлы в репозитории.<br><small></small>';
  el.querySelector('small').textContent = String(msg || 'неизвестная ошибка');
}

/* ==========================================================================
   3. ВКЛАДКИ
   ========================================================================== */

const VALID_TABS = ['students', 'stats'];

function switchTab(tabName) {
  if (VALID_TABS.indexOf(tabName) === -1) return;

  document.getElementById('tab-students').hidden = true;
  document.getElementById('tab-stats').hidden = true;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.setAttribute('aria-selected', 'false');
  });

  const activeBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.setAttribute('aria-selected', 'true');
  }

  if (tabName === 'students') {
    document.getElementById('tab-students').hidden = false;
  } else {
    document.getElementById('tab-stats').hidden = false;
  }
}

/* ==========================================================================
   4. УТИЛИТЫ
   ========================================================================== */

function safeParseNumber(val) {
  if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
  if (val === null || val === undefined || val === '') return 0;
  if (Object.prototype.toString.call(val) === '[object Date]') return 0;

  let s = String(val).replace(/[^\d.,-]/g, '');
  if (!s) return 0;

  const lastDot = s.lastIndexOf('.');
  const lastComma = s.lastIndexOf(',');

  if (lastDot >= 0 && lastComma >= 0) {
    if (lastDot > lastComma) {
      s = s.replace(/,/g, '');
    } else {
      s = s.replace(/\./g, '').replace(',', '.');
    }
  } else if (lastComma >= 0) {
    s = s.replace(',', '.');
  }

  const num = parseFloat(s);
  return Number.isFinite(num) ? num : 0;
}

function round2(num) {
  if (!Number.isFinite(num)) return 0;
  return Math.round(num * 100) / 100;
}

function formatNumber(v) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

function extractCellValue(v) {
  if (v === null || v === undefined) return '';
  const t = typeof v;
  if (t === 'number' || t === 'string' || t === 'boolean') return v;
  if (Object.prototype.toString.call(v) === '[object Date]') return v;

  if (v.richText) return v.richText.map(r => r.text || '').join('');

  if ('result' in v) {
    const r = v.result;
    if (r === null || r === undefined) return '';
    if (typeof r === 'object') {
      if (r.error) return '';
      if (r.richText) return r.richText.map(x => x.text || '').join('');
    }
    return r;
  }

  if ('error' in v) return '';
  if ('text' in v) return v.text;
  return '';
}

function getCellStatus(cell) {
  try {
    const fill = cell.fill;
    if (!fill || fill.type !== 'pattern' || fill.pattern !== 'solid') return 'debt';

    const fg = fill.fgColor;
    if (!fg) return 'debt';

    let rgb = '';
    if (fg.argb) rgb = String(fg.argb).toUpperCase();

    if (!rgb && fg.indexed !== undefined) {
      const map = { 42: 'C6EFCE', 43: 'FFEB9C', 44: 'FFC7CE' };
      rgb = map[fg.indexed] || '';
    }

    if (!rgb) return 'debt';
    if (rgb.length === 8 && rgb.startsWith('FF')) rgb = rgb.substring(2);

    if (rgb === 'C6EFCE') return 'paid';
    if (rgb === 'FFEB9C' || rgb === 'FFFF00') return 'excused';
    if (rgb === 'FFC7CE') return 'debt';
    return 'debt';
  } catch (e) {
    return 'debt';
  }
}

function isDebtCell(row, c) {
  return row[c].status === 'debt' && safeParseNumber(row[c].v) > 0;
}

/* ==========================================================================
   5. РАСЧЁТЫ
   ========================================================================== */

function computeTotals() {
  const { dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const totals = new Array(totalCols).fill(0);
  const expenseTotals = {};
  let collected = 0;
  let spent = 0;

  dataRows.forEach(row => {
    const paidVal = safeParseNumber(row[statusColIndex].v);
    totals[statusColIndex] = round2(totals[statusColIndex] + paidVal);
    collected = round2(collected + paidVal);

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status === 'excused') continue;

      const val = safeParseNumber(row[c].v);
      totals[c] = round2(totals[c] + val);
      expenseTotals[c] = round2((expenseTotals[c] || 0) + val);
      spent = round2(spent + val);
    }
  });

  totals[remainingColIndex] = round2(totals[statusColIndex] - spent);

  return { totals, collected, spent, expenseTotals };
}

function computeChildStats(row) {
  const { numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const childPaid = safeParseNumber(row[statusColIndex].v);
  let hasAnyPayment = childPaid > 0;
  let hasDebt = false;
  let childSpent = 0;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    if (row[c].status === 'excused') continue;

    const val = safeParseNumber(row[c].v);
    childSpent = round2(childSpent + val);

    if (val > 0) {
      if (row[c].status === 'paid') hasAnyPayment = true;
      else if (row[c].status === 'debt') hasDebt = true;
    }
  }

  return {
    childPaid,
    childSpent,
    childBalance: round2(childPaid - childSpent),
    hasAnyPayment,
    hasDebt
  };
}

/* ==========================================================================
   6. ЗАГРУЗКА
   ========================================================================== */

async function init() {
  hasError = false;
  abortController = new AbortController();

  try {
    if (typeof ExcelJS === 'undefined') {
      throw new Error('Библиотека exceljs.min.js не найдена.');
    }

    const resp = await fetch('data.xlsx', { cache: 'no-store', signal: abortController.signal });
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      if (!isNaN(d.getTime())) {
        const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastUpdated').textContent = 'Обновлено: ' + dateStr + ' в ' + timeStr;
      }
    }

    const buf = await resp.arrayBuffer();
    clearTimeout(loadTimeout);

    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);

    const ws = wb.worksheets[0];
    if (!ws) throw new Error('В файле нет листов');

    const columns = Math.max(1, ws.columnCount || 0);
    const rows = [];

    ws.eachRow({ includeEmpty: false }, (row) => {
      const cells = [];
      for (let c = 1; c <= columns; c++) {
        const cell = row.getCell(c);
        cells.push({
          v: extractCellValue(cell.value),
          status: getCellStatus(cell)
        });
      }
      rows.push(cells);
    });

    if (rows.length === 0) throw new Error('Файл не содержит данных.');

    parseData(rows, columns);

    if (!hasError) {
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
    }
  } catch (e) {
    clearTimeout(loadTimeout);
    if (e && e.name === 'AbortError') return;
    if (e && e.message === 'Failed to fetch') {
      showError('Нет подключения к интернету. Проверьте сеть.');
    } else {
      showError((e && e.message) || String(e) || 'неизвестная ошибка');
    }
  }
}

/* ==========================================================================
   7. ПАРСИНГ
   ========================================================================== */

function parseData(rows, totalCols) {
  if (!rows || rows.length === 0) throw new Error('Файл пуст.');

  const headerRow = rows[0].map(c => c.v);
  const dataRows = [];

  let statusColIndex = -1;
  let remainingColIndex = -1;

  headerRow.forEach((title, idx) => {
    const t = String(title || '').toLowerCase();
    if (t.includes('сдал') || t.includes('оплата') || t.includes('взнос')) statusColIndex = idx;
    if (t.includes('остаток') || t.includes('долг')) remainingColIndex = idx;
  });

  if (statusColIndex === -1) throw new Error('В шапке не найден столбец «Сдали»');
  if (remainingColIndex === -1) throw new Error('В шапке не найден столбец «Остаток»');
  if (statusColIndex === 0) throw new Error('Столбец «Сдали» не может быть первым — там ФИО');
  if (remainingColIndex === 0) throw new Error('Столбец «Остаток» не может быть первым — там ФИО');
  if (statusColIndex === remainingColIndex) throw new Error('Столбцы «Сдали» и «Остаток» совпадают — проверьте шапку');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;

    const name = String(r[0].v || '').trim();
    if (!name) continue;

    const lower = name.toLowerCase();
    if (lower.startsWith('итог') || lower === 'всего' || lower === 'общий') continue;
    if (!/[а-яёa-z]/i.test(name)) continue;

    dataRows.push(r);
  }

  if (dataRows.length === 0) throw new Error('Не найдено строк с именами детей.');

  const numericCols = [];
  for (let c = 1; c < totalCols; c++) {
    let hasNum = false;
    for (const row of dataRows) {
      if (typeof row[c].v === 'number') { hasNum = true; break; }
      if (typeof row[c].v === 'string' && /\d/.test(row[c].v)) { hasNum = true; break; }
    }
    if (hasNum) numericCols.push(c);
  }

  globalData = { dataRows, headerRow, numericCols, totalCols, statusColIndex, remainingColIndex };

  globalTotals = computeTotals();

  renderTable();
  renderStats();

  const searchInput = document.getElementById('search');
  if (!searchInput.dataset.listenerAttached) {
    searchInput.addEventListener('input', filterRows);
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterRows();
      }
    });
    searchInput.dataset.listenerAttached = '1';
  }
  filterRows();
}

/* ==========================================================================
   8. ТАБЛИЦА
   ========================================================================== */

function renderTable() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { totals } = globalTotals;

  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    if (numericSet.has(c) || c === statusColIndex || c === remainingColIndex) {
      th.classList.add('num');
      th.textContent = formatNumber(totals[c] || 0);
    }
    theadTotals.appendChild(th);
  }

  const fragment = document.createDocumentFragment();

  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden');

    const stats = computeChildStats(row);
    if (stats.hasDebt) tr.classList.add('row-unpaid');

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const isNum = numericSet.has(c);

      if (!isNum) {
        const s = row[c].v === '' || row[c].v == null ? '—' : String(row[c].v);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
        tr.appendChild(td);
        continue;
      }

      td.classList.add('num');

      if (c === remainingColIndex) {
        if (Math.abs(stats.childBalance) < 0.01) {
          td.textContent = '—';
          td.classList.add('zero');
        } else {
          td.textContent = formatNumber(stats.childBalance);
          if (stats.childBalance < 0) td.classList.add('negative');
        }
        tr.appendChild(td);
        continue;
      }

      const val = safeParseNumber(row[c].v);
      const status = row[c].status;

      if (status === 'excused') {
        td.textContent = String(row[c].v || 'б/н');
        td.classList.add('excused');
      } else if (val === 0) {
        td.textContent = '—';
        td.classList.add('zero');
        if (c === statusColIndex) td.classList.add('unpaid');
      } else {
        td.textContent = formatNumber(val);
        if (val < 0) td.classList.add('negative');
        if (c === statusColIndex) {
          td.classList.add('paid');
        } else if (c > 2 && isDebtCell(row, c)) {
          td.classList.add('cell-unpaid');
        }
      }

      tr.appendChild(td);
    }

    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment);
}

/* ==========================================================================
   9. ДАШБОРД
   ========================================================================== */

function renderStats() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { collected, spent, expenseTotals } = globalTotals;
  const balance = round2(collected - spent);

  document.getElementById('kpi-collected').textContent = formatNumber(collected) + ' ₽';
  document.getElementById('kpi-spent').textContent = formatNumber(spent) + ' ₽';

  const balanceEl = document.getElementById('kpi-balance');
  balanceEl.textContent = formatNumber(balance) + ' ₽';
  balanceEl.classList.toggle('red', balance < 0);

  let fullyPaid = 0, partiallyPaid = 0, notPaid = 0;

  dataRows.forEach(row => {
    const stats = computeChildStats(row);
    if (!stats.hasDebt) fullyPaid++;
    else if (stats.hasAnyPayment) partiallyPaid++;
    else notPaid++;
  });

  document.getElementById('paymentStats').innerHTML =
    '<div class="status-item">' +
      '<span class="status-label">Сдали всё</span>' +
      '<span class="status-value green">' + fullyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Сдали частично</span>' +
      '<span class="status-value yellow">' + partiallyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Пока не сдавали</span>' +
      '<span class="status-value red">' + notPaid + ' чел.</span>' +
    '</div>';

  const expensesEl = document.getElementById('expensesList');
  expensesEl.innerHTML = '';
  let hasExpenses = false;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    const totalAmount = expenseTotals[c] || 0;
    if (totalAmount <= 0) continue;

    hasExpenses = true;
    const div = document.createElement('div');
    div.className = 'price-item';

    const nameEl = document.createElement('span');
    nameEl.className = 'price-name';
    nameEl.textContent = headerRow[c] || ('Колонка ' + (c + 1));

    const amountEl = document.createElement('span');
    amountEl.className = 'price-amount';
    amountEl.textContent = formatNumber(totalAmount) + ' ₽';

    div.appendChild(nameEl);
    div.appendChild(amountEl);
    expensesEl.appendChild(div);
  }

  if (!hasExpenses) {
    expensesEl.innerHTML = '<div class="empty">Расходов пока нет</div>';
  }
}

/* ==========================================================================
   10. ПОИСК
   ========================================================================== */

function filterRows() {
  const input = document.getElementById('search');
  const q = input.value.trim().toLowerCase();
  const rowCountEl = document.getElementById('rowCount');
  const rows = document.querySelectorAll('#tableBody tr');

  if (SECRET_TOKEN && q === SECRET_TOKEN.toLowerCase()) {
    rows.forEach(tr => tr.classList.remove('hidden'));
    rowCountEl.textContent = 'Все записи (' + rows.length + ')';
    rowCountEl.classList.add('accountant-mode');
    return;
  }

  rowCountEl.classList.remove('accountant-mode');

  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    rowCountEl.textContent = 'Список скрыт';
    return;
  }

  let found = 0;
  rows.forEach(tr => {
    const nameCell = tr.cells[0];
    if (nameCell && nameCell.textContent.toLowerCase().includes(q)) {
      tr.classList.remove('hidden');
      found++;
    } else {
      tr.classList.add('hidden');
    }
  });

  rowCountEl.textContent = found > 0 ? ('Найдено: ' + found) : 'Не найдено';
}

/* ==========================================================================
   11. ПРИВЯЗКА ВКЛАДОК
   ========================================================================== */

document.querySelectorAll('.tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    switchTab(btn.dataset.tab);
  });
});

/* ==========================================================================
   12. СТАРТ
   ========================================================================== */

init();
</script>
