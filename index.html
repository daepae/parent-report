<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт родительского комитета</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --border-soft: #f1f5f9;
    --accent: #6366f1; --success: #16a34a; --danger: #dc2626;
    --radius: 12px; --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px -1px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  
  [hidden] { display: none !important; }

  .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 24px 32px 48px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0; }
  header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .tab-btn { background: transparent; border: none; padding: 8px 16px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: var(--radius-sm); transition: all 0.2s; }
  .tab-btn:hover { background: var(--border-soft); color: var(--text); }
  .tab-btn.active { background: var(--accent); color: #fff; }

  .table-section, .dashboard-section { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  
  .toolbar { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); }
  .search-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 250px; max-width: 500px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search-wrap input {
    width: 100%; padding: 9px 12px 9px 36px; font-size: 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
  .row-count { font-size: 13px; color: var(--muted); margin-left: auto; }

  .table-wrapper { overflow-x: auto; width: 100%; max-height: 70vh; }
  table { width: auto; min-width: 100%; border-collapse: collapse; font-size: 14px; }
  
  thead { position: sticky; top: 0; z-index: 10; }
  th { background: #f8fafc; color: var(--muted); font-weight: 600; text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none; }
  #tableHeadTotals th { background: #f1f5f9; color: var(--text); font-weight: 700; text-transform: none; font-size: 14px; padding: 10px 16px; border-bottom: 2px solid var(--border); }
  #tableHeadTotals th.num { color: var(--success); font-size: 15px; }

  td { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: #f8fafc; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.hidden { display: none !important; }

  tbody tr.row-unpaid { background-color: #fff1f2 !important; }
  tbody tr.row-unpaid:hover { background-color: #ffe4e6 !important; }
  td.cell-unpaid { background-color: #ffe4e6; color: var(--danger) !important; font-weight: 600; }

  th.num, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }
  td.zero { color: #cbd5e1; }
  td.negative { color: var(--danger); }
  td.paid { color: var(--success); font-weight: 600; }
  td.unpaid { color: var(--danger); font-weight: 600; }
  td.excused { color: #8b5cf6 !important; font-weight: 600; font-size: 13px; }

  .dashboard-section { padding: 24px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
  .kpi-label { font-size: 13px; color: var(--muted); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px;}
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .kpi-value.green { color: var(--success); }
  .kpi-value.blue { color: var(--accent); }
  .kpi-value.red { color: var(--danger); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .stat-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; }
  .stat-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text); flex-shrink: 0; }
  
  .progress-list { display: flex; flex-direction: column; gap: 12px; }
  .progress-item { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .progress-bar-bg { flex: 1; height: 8px; background: var(--border-soft); border-radius: 4px; margin: 0 12px; overflow: hidden;}
  .progress-bar-fill { height: 100%; border-radius: 4px; }
  
  .fill-green { background: #4ade80; }
  .fill-yellow { background: #fcd34d; }
  .fill-red { background: #f87171; }

  .price-list { 
    display: flex; flex-direction: column; gap: 0; 
    max-height: 400px; overflow-y: auto; padding-right: 8px;
  }
  .price-list::-webkit-scrollbar { width: 6px; }
  .price-list::-webkit-scrollbar-track { background: transparent; }
  .price-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .price-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .price-list { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }

  .price-item { 
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); gap: 16px;
  }
  .price-item:first-child { padding-top: 0; }
  .price-item:last-child { border-bottom: none; padding-bottom: 0; }
  
  .price-name { 
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); line-height: 1.4; flex: 1;
  }
  .price-amount { 
    font-size: 15px; font-weight: 700; color: var(--success); 
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--muted); gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 20px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; margin-top: 20px; word-break: break-word; }
  .error code { background: rgba(153,27,27,.08); padding: 2px 6px; border-radius: 4px; font-weight: 600; }

  @media (max-width: 768px) {
    .container { padding: 16px 12px; }
    header { flex-direction: column; }
    .row-count { margin: 8px 0 0; text-align: right; width: 100%; }
    #tableHeadTotals th { font-size: 13px; padding: 8px 12px; }
    .dashboard-section { padding: 16px; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('students')">Мой ребенок</button>
      <button class="tab-btn" onclick="switchTab('stats')">Статистика класса</button>
    </div>

    <div id="tab-students">
      <section class="table-section">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="search" id="search" placeholder="Введите 2+ буквы фамилии..." autocomplete="off">
            </div>
            <span class="row-count" id="rowCount">Список скрыт</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
              <tr id="tableHeadTotals"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-stats" hidden>
      <section class="dashboard-section">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Собрано всего</div>
            <div class="kpi-value green" id="kpi-collected">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Потрачено всего</div>
            <div class="kpi-value blue" id="kpi-spent">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Остаток в кассе</div>
            <div class="kpi-value" id="kpi-balance">0 ₽</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Статус сборов</div>
            <div class="progress-list" id="paymentStats"></div>
          </div>

          <div class="stat-card">
            <div class="stat-title">На что потрачены деньги</div>
            <div class="price-list" id="expensesList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
let globalData = { dataRows: [], headerRow: [], numericCols: [], totalCols: 0 };

window.addEventListener('error', function(e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});
window.addEventListener('unhandledrejection', function(e) {
  showError('Ошибка загрузки: ' + (e.reason?.message || e.reason || 'неизвестная ошибка'));
});

let abortController = null;
const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (10 сек). Проверьте интернет.');
}, 10000);

function showError(msg) {
  clearTimeout(loadTimeout);
  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = true;
  const el = document.getElementById('error');
  el.hidden = false;
  el.innerHTML = `<strong>Не удалось загрузить данные.</strong><br>Проверьте файлы в репозитории.<br><small>${msg}</small>`;
}

function switchTab(tabName) {
  document.getElementById('tab-students').hidden = true;
  document.getElementById('tab-stats').hidden = true;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  
  if (tabName === 'students') {
    document.getElementById('tab-students').hidden = false;
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
  } else {
    document.getElementById('tab-stats').hidden = false;
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
  }
}

function cleanNumber(val) {
  if (typeof val === 'number') return val;
  if (val === null || val === undefined || val === '') return NaN;
  const str = String(val).replace(/[\s\u00A0]/g, '').replace(',', '.');
  const num = parseFloat(str);
  return isNaN(num) ? NaN : num;
}

// Надежное определение зеленого цвета (с защитой от ошибок)
function isGreenColor(cell) {
  try {
    if (!cell || !cell.s || !cell.s.fill) return false;
    const fill = cell.s.fill;
    const fg = fill.fgColor || fill.bgColor;
    
    if (fg && fg.rgb) {
      const rgb = String(fg.rgb).toUpperCase();
      if (rgb.startsWith('FF') && rgb.length === 8) {
        const r = parseInt(rgb.substring(2, 4), 16);
        const g = parseInt(rgb.substring(4, 6), 16);
        const b = parseInt(rgb.substring(6, 8), 16);
        // Зеленый канал должен доминировать
        return g > 100 && g > r * 1.2 && g > b * 1.2;
      }
    }
    // Если цвет задан через тему (theme), но он явно не белый и не пустой
    if (fg && fg.theme !== undefined) {
       // В темах Excel зеленый обычно имеет индекс 4, 5, 6, 7, 8, 9 (зависит от палитры)
       // Для надежности, если это не 0 и не 1 (обычно белый/черный), можно пропустить, 
       // но лучше довериться RGB. Если RGB нет, считаем что не зеленый (перестраховка для кассы).
    }
  } catch (e) {
    console.warn('Ошибка при чтении цвета ячейки', e);
  }
  return false;
}

async function init() {
  abortController = new AbortController();
  try {
    if (typeof XLSX === 'undefined') throw new Error('Библиотека xlsx.full.min.js не найдена.');
    
    const resp = await fetch('data.xlsx', { cache: 'no-store', signal: abortController.signal });
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
      document.getElementById('lastUpdated').textContent = `Обновлено: ${dateStr} в ${timeStr}`;
    }

    const buf = await resp.arrayBuffer();
    // cellStyles: true — критически важно для чтения цветов
    const wb = XLSX.read(buf, { type: 'array', cellFormula: false, cellStyles: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    if (!ws) throw new Error('В файле нет листов');

    const range = XLSX.utils.decode_range(ws['!ref']);
    let maxCols = range.e.c + 1;
    
    // Обрезаем пустые столбцы справа, если они есть
    while (maxCols > 1) {
      let isEmpty = true;
      for (let r = 0; r <= range.e.r; r++) {
        const cell = ws[XLSX.utils.encode_cell({ r: r, c: maxCols - 1 })];
        if (cell && cell.v !== undefined && cell.v !== '') { isEmpty = false; break; }
      }
      if (isEmpty) maxCols--; else break;
    }

    const rows = [];
    for (let r = 0; r <= range.e.r; r++) {
      const row = [];
      for (let c = 0; c < maxCols; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r: r, c: c })];
        row.push({
          v: cell ? cell.v : '',
          green: isGreenColor(cell)
        });
      }
      rows.push(row);
    }

    parseData(rows, maxCols);
    
    clearTimeout(loadTimeout);
    document.getElementById('loading').hidden = true;
    document.getElementById('content').hidden = false;
  } catch (e) {
    if (e.name === 'AbortError') return; 
    if (e.message === 'Failed to fetch') showError('Нет подключения к интернету. Проверьте сеть.');
    else showError(e.message);
  }
}

function parseData(rows, totalCols) {
  if (!rows || rows.length === 0) throw new Error('Файл пуст.');

  const headerRow = rows[0].map(c => c.v);
  const dataRows = [];
  let statusColIndex = 1; // По умолчанию второй столбец (Сдали)
  let remainingColIndex = 2; // По умолчанию третий (Остаток)

  // Ищем точные индексы столбцов
  headerRow.forEach((title, idx) => {
    const t = String(title || '').toLowerCase();
    if (t.includes('сдал') || t.includes('оплата') || t.includes('взнос')) statusColIndex = idx;
    if (t.includes('остаток') || t.includes('долг')) remainingColIndex = idx;
  });

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;
    
    const firstColVal = String(r[0].v || '').trim();
    const firstColLower = firstColVal.toLowerCase();
    
    if (firstColLower.includes('итог') || firstColLower.includes('общий') || firstColLower.includes('всего')) continue;
    if (firstColVal === '' && r.some(c => typeof c.v === 'number')) continue;
    
    if (firstColVal !== '' && /[a-zA-Zа-яА-Я]/.test(firstColVal)) { 
      dataRows.push(r); 
    }
  }

  if (dataRows.length === 0) throw new Error('Не найдено строк с именами детей.');

  const numericCols = [];
  for (let c = 1; c < totalCols; c++) { 
    let hasNum = false;
    for (const row of dataRows) {
      if (typeof row[c].v === 'number') { hasNum = true; break; }
    }
    if (hasNum) numericCols.push(c); 
  }

  globalData = { dataRows, headerRow, numericCols, totalCols, statusColIndex, remainingColIndex };

  renderTable();
  renderStats();

  document.getElementById('search').addEventListener('input', filterRows);
  filterRows();
}

function renderTable() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');
  const numericSet = new Set(numericCols);

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  const computedTotals = new Array(totalCols).fill(0);
  
  // 1. Считаем ИТОГИ
  dataRows.forEach(row => {
    computedTotals[statusColIndex] += cleanNumber(row[statusColIndex].v) || 0;
    
    for (let c = 3; c < totalCols; c++) {
      if (numericSet.has(c) && c !== statusColIndex && c !== remainingColIndex) {
        // В кассу берем ТОЛЬКО зеленые ячейки
        if (row[c].green) {
          const val = cleanNumber(row[c].v);
          if (!isNaN(val)) computedTotals[c] += val;
        }
      }
    }
  });
  
  let totalSpent = 0;
  for (let c = 3; c < totalCols; c++) {
    if (numericSet.has(c) && c !== statusColIndex && c !== remainingColIndex) totalSpent += computedTotals[c];
  }
  computedTotals[remainingColIndex] = computedTotals[statusColIndex] - totalSpent;

  // 2. Рендерим шапку
  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    if (numericSet.has(c)) {
      th.classList.add('num');
      th.textContent = formatNumber(computedTotals[c]);
    } else {
      th.textContent = '';
    }
    theadTotals.appendChild(th);
  }

  // 3. Рендерим строки
  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden'); 
    
    let isRowUnpaid = false;
    for (let c = 3; c < totalCols; c++) { 
      if (!numericSet.has(c) || c === remainingColIndex) continue;
      const val = row[c].v;
      const isGreen = row[c].green;
      const num = cleanNumber(val);
      
      // Если есть цифра, но ячейка НЕ зеленая — это долг
      if (!isGreen && !isNaN(num) && Math.abs(num) >= 0.01) {
        isRowUnpaid = true;
      }
    }
    if (isRowUnpaid) tr.classList.add('row-unpaid');

    const childPaid = cleanNumber(row[statusColIndex].v) || 0;
    let childSpent = 0;
    
    for (let c = 3; c < totalCols; c++) {
      if (numericSet.has(c) && c !== statusColIndex && c !== remainingColIndex && row[c].green) {
        const num = cleanNumber(row[c].v);
        if (!isNaN(num)) childSpent += num;
      }
    }
    const childBalance = childPaid - childSpent;

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const isNum = numericSet.has(c);

      if (isNum) {
        td.classList.add('num');
        
        if (c === remainingColIndex) {
          if (Math.abs(childBalance) < 0.01) {
            td.textContent = '—';
            td.classList.add('zero');
          } else {
            td.textContent = formatNumber(childBalance);
            if (childBalance < 0) td.classList.add('negative');
          }
        } else {
          const val = row[c].v;
          const num = cleanNumber(val);
          
          // Проверка на текст (уважительная причина)
          if (isNaN(num) && val !== '' && val != null) {
            td.textContent = String(val);
            td.classList.add('excused');
          } else if (Math.abs(num) < 0.01) {
            td.textContent = '—';
            td.classList.add('zero');
            if (c === statusColIndex) td.classList.add('unpaid'); 
            else if (c > 2 && c !== remainingColIndex) td.classList.add('cell-unpaid'); 
          } else {
            td.textContent = formatNumber(num);
            if (num < 0) td.classList.add('negative');
            
            if (c === statusColIndex) {
              td.classList.add('paid'); 
            } else if (c > 2 && c !== remainingColIndex) {
              // Если есть цифра, но не зеленая — это долг (красный)
              if (!row[c].green) td.classList.add('cell-unpaid');
            }
          }
        }
      } else {
        const s = row[c].v === '' || row[c].v == null ? '—' : String(row[c].v);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

function renderStats() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const studentsCount = dataRows.length;

  let collected = 0;
  let spent = 0;
  const expenseTotals = {};

  dataRows.forEach(row => {
    collected += cleanNumber(row[statusColIndex].v) || 0;
    for (let c = 3; c < totalCols; c++) {
      if (numericSet.has(c) && c !== statusColIndex && c !== remainingColIndex && row[c].green) {
        const val = cleanNumber(row[c].v);
        if (!isNaN(val)) {
          spent += val;
          expenseTotals[c] = (expenseTotals[c] || 0) + val;
        }
      }
    }
  });
  
  const balance = collected - spent;

  document.getElementById('kpi-collected').textContent = formatNumber(collected) + ' ₽';
  document.getElementById('kpi-spent').textContent = formatNumber(spent) + ' ₽';
  
  const balanceEl = document.getElementById('kpi-balance');
  balanceEl.textContent = formatNumber(balance) + ' ₽';
  if (balance < 0) balanceEl.classList.add('red'); else balanceEl.classList.remove('red');

  const pStatsEl = document.getElementById('paymentStats');
  let fullyPaid = 0, partiallyPaid = 0, notPaid = 0;

  dataRows.forEach(row => {
    let hasAnyPayment = false;
    let hasDebt = false;
    
    const generalPaid = cleanNumber(row[statusColIndex].v) || 0;
    if (generalPaid > 0) hasAnyPayment = true;

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      
      const isGreen = row[c].green;
      const val = row[c].v;
      const num = cleanNumber(val);
      
      // Если ячейка зеленая, значит человек оплатил
      if (isGreen) {
        if (!isNaN(num) && num > 0) hasAnyPayment = true;
      } else {
        // Если ячейка не зеленая, и там цифра — это долг
        if (!isNaN(num) && num > 0) {
          hasDebt = true;
        }
      }
    }

    if (!hasDebt) {
      fullyPaid++;
    } else if (hasAnyPayment) {
      partiallyPaid++;
    } else {
      notPaid++;
    }
  });

  pStatsEl.innerHTML = `
    <div class="progress-item">
      <span>Сдали всё</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill fill-green" style="width: ${(fullyPaid/studentsCount)*100}%"></div></div>
      <strong>${fullyPaid} чел.</strong>
    </div>
    <div class="progress-item">
      <span>Сдали частично</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill fill-yellow" style="width: ${(partiallyPaid/studentsCount)*100}%"></div></div>
      <strong>${partiallyPaid} чел.</strong>
    </div>
    <div class="progress-item">
      <span>Пока не сдавали</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill fill-red" style="width: ${(notPaid/studentsCount)*100}%"></div></div>
      <strong>${notPaid} чел.</strong>
    </div>
  `;

  const expensesEl = document.getElementById('expensesList');
  expensesEl.innerHTML = '';
  
  let hasExpenses = false;
  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    const totalAmount = expenseTotals[c] || 0;
    if (totalAmount > 0) {
      hasExpenses = true;
      const name = headerRow[c] || `Колонка ${c+1}`;
      
      const div = document.createElement('div');
      div.className = 'price-item';
      div.innerHTML = `
        <span class="price-name">${name}</span> 
        <span class="price-amount">${formatNumber(totalAmount)} ₽</span>
      `;
      expensesEl.appendChild(div);
    }
  }

  if (!hasExpenses) {
    expensesEl.innerHTML = '<div style="color:var(--muted); font-size:14px;">Расходов пока нет</div>';
  }
}

function filterRows() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const rows = document.querySelectorAll('#tableBody tr');
  
  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    document.getElementById('rowCount').textContent = 'Список скрыт';
    return;
  }

  let found = 0;
  rows.forEach(tr => {
    const nameCell = tr.cells[0];
    const isMatch = nameCell && nameCell.textContent.toLowerCase().includes(q);
    if (isMatch) { tr.classList.remove('hidden'); found++; }
    else { tr.classList.add('hidden'); }
  });
  
  document.getElementById('rowCount').textContent = found > 0 ? `Найдено: ${found}` : 'Не найдено';
}

function formatNumber(v) {
  if (typeof v !== 'number' || !isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  const rounded = Math.round(v * 100) / 100;
  return rounded.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

init();
</script>
