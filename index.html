<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Отчёт родительского комитета</title>

<!-- ExcelJS — чтение xlsx с сохранением цветов заливки -->
<script src="exceljs.min.js"></script>

<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e1a;
    --spot-1: rgba(99, 102, 241, .18);
    --spot-2: rgba(168, 85, 247, .13);
    --card: rgba(23, 27, 47, .74);
    --card-solid: #171b2f;
    --row-bg: #1a1e33;
    --row-bg-unpaid: #2a1f2a;
    --header-bg: rgba(19, 23, 41, .82);
    --text: #e6eaf3;
    --muted: #97a1b8;
    --border: rgba(148, 163, 184, .16);
    --border-soft: rgba(148, 163, 184, .09);
    --accent: #818cf8;
    --accent-2: #a78bfa;
    --accent-glow: rgba(129, 140, 248, .35);
    --success: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
    --danger-text: #f2a3a3;
    --danger-strip: #e05252;
    --row-tint: rgba(224, 82, 82, .09);
    --cell-fill: rgba(224, 82, 82, .17);
    --excused: #c9a97c;
    --zero: #5d6885;
    --radius: 14px; --radius-sm: 10px;
    --shadow: 0 8px 28px rgba(3, 6, 20, .45);
    --shadow-sm: 0 2px 10px rgba(3, 6, 20, .3);
    --col-shadow: 8px 0 12px -8px rgba(3, 6, 20, .55);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #eef1f8;
      --spot-1: rgba(99, 102, 241, .12);
      --spot-2: rgba(168, 85, 247, .09);
      --card: rgba(255, 255, 255, .86);
      --card-solid: #ffffff;
      --row-bg: #ffffff;
      --row-bg-unpaid: #fdf2f3;
      --header-bg: rgba(244, 246, 252, .88);
      --text: #1e293b;
      --muted: #64748b;
      --border: rgba(15, 23, 42, .1);
      --border-soft: rgba(15, 23, 42, .06);
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --accent-glow: rgba(99, 102, 241, .28);
      --success: #16a34a;
      --warn: #ca8a04;
      --danger: #dc2626;
      --danger-text: #b42318;
      --danger-strip: #dc2626;
      --row-tint: rgba(220, 38, 38, .055);
      --cell-fill: rgba(220, 38, 38, .13);
      --excused: #8a6d3b;
      --zero: #94a3b8;
      --shadow: 0 8px 24px rgba(15, 23, 42, .08);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, .05);
      --col-shadow: 8px 0 12px -8px rgba(15, 23, 42, .18);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(900px 600px at 12% -10%, var(--spot-1), transparent 60%),
      radial-gradient(1100px 700px at 95% 25%, var(--spot-2), transparent 65%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
  }
  [hidden] { display: none !important; }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 28px 32px 56px; }
  h1 {
    font-size: clamp(22px, 4.5vw, 30px); font-weight: 800; margin: 0 0 6px;
    letter-spacing: -.02em; line-height: 1.25;
    color: var(--text);
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    h1 {
      background: linear-gradient(92deg, var(--text) 20%, var(--accent) 75%, var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
  }
  .subtitle { color: var(--muted); font-size: 13.5px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .subtitle::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 8px var(--success);
    flex-shrink: 0;
  }
  .subtitle:empty { display: none; }
  header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }

  .tabs {
    display: inline-flex; gap: 4px; margin-bottom: 20px;
    padding: 4px; border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow-sm);
  }
  .tab-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 10px 22px; font-size: 15px; font-weight: 600; font-family: inherit;
    color: var(--muted); border-radius: 999px;
    transition: color .2s, background .2s, box-shadow .2s;
    min-height: 44px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 18px var(--accent-glow);
  }

  .table-section, .dashboard-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
  }

  .toolbar { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); }
  .search-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 250px; max-width: 520px; }
  .search-wrap svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--muted); pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 11px 40px 11px 44px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--row-bg); color: var(--text); font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input::placeholder { color: var(--muted); opacity: .8; }
  .search-wrap input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-wrap input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .row-count, .row-count.accountant-mode { display: none; }

  .table-wrapper {
    overflow: auto; width: 100%;
    max-height: 100vh; max-height: 100dvh;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scrollbar-width: thin; scrollbar-color: var(--zero) transparent;
  }
  .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
  .table-wrapper::-webkit-scrollbar-track { background: transparent; }
  .table-wrapper::-webkit-scrollbar-thumb { background: var(--zero); border-radius: 4px; }

  table {
    width: max-content; min-width: 100%;
    border-collapse: separate; border-spacing: 0;
    font-size: 14px;
  }

  thead { position: sticky; top: 0; z-index: 10; }
  th {
    background: var(--header-bg);
    color: var(--muted);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-weight: 700; text-align: left;
    padding: 12px 14px; font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .05em;
    border-bottom: 1px solid var(--border);
    white-space: normal; max-width: 11em;
    vertical-align: bottom; user-select: none;
  }
  #tableHeadTotals th {
    max-width: none; white-space: nowrap;
    color: var(--text); font-weight: 700; text-transform: none;
    font-size: 14.5px; padding: 10px 14px;
    border-bottom: 2px solid var(--border);
    vertical-align: middle;
  }
  #tableHeadTotals th.num { color: var(--success); font-size: 15px; }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-soft);
    white-space: nowrap;
  }
  tbody tr { background: var(--row-bg); transition: background .12s; }
  tbody tr:hover { filter: brightness(1.06); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.hidden { display: none !important; }

  tbody tr.row-unpaid { background: var(--row-bg-unpaid); }
  tbody tr.row-unpaid:hover { filter: none; }

  td:first-child, th:first-child {
    position: sticky; left: 0; z-index: 5;
    background: inherit;
    box-shadow: var(--col-shadow);
  }
  thead th:first-child { z-index: 12; }
  td:first-child {
    white-space: normal; word-break: normal; overflow-wrap: normal; hyphens: none;
    font-weight: 600; min-width: 8.5em; max-width: 11em;
  }
  tr.row-unpaid td:first-child {
    box-shadow: inset 3px 0 0 0 var(--danger-strip), var(--col-shadow);
  }

  td.cell-unpaid {
    background: var(--cell-fill);
    color: var(--danger-text);
    font-weight: 700;
  }
  td.cell-unpaid::before {
    content: '\00d7'; display: inline-block; font-size: 12px; font-weight: 800;
    line-height: 1; vertical-align: 1px; margin-right: 4px; opacity: .85;
  }

  th.num, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }
  td.zero { color: var(--zero); }
  td.negative { color: var(--danger); }
  td.paid { color: var(--success); font-weight: 600; }
  td.unpaid { color: var(--danger); font-weight: 600; }
  td.excused { color: var(--excused); font-weight: 500; font-size: 13.5px; }

  .dashboard-section { padding: 24px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card {
    position: relative; overflow: hidden;
    background: var(--card-solid); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm);
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: .85;
  }
  .kpi-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    font-weight: 700; margin-bottom: 8px; letter-spacing: .07em;
    display: flex; align-items: center; gap: 7px;
  }
  .kpi-label::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
  .kpi-card:has(.kpi-value.green) .kpi-label::before { background: var(--success); }
  .kpi-card:has(.kpi-value.blue) .kpi-label::before { background: var(--accent); }
  .kpi-card:has(.kpi-value.red) .kpi-label::before { background: var(--danger); }
  .kpi-value {
    font-size: clamp(24px, 6vw, 30px); font-weight: 800; letter-spacing: -.5px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .kpi-value.green { color: var(--success); }
  .kpi-value.blue { color: var(--accent); }
  .kpi-value.red { color: var(--danger); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .stat-card {
    background: var(--card-solid); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px;
    display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
  }
  .stat-title {
    font-size: 13px; font-weight: 700; margin-bottom: 16px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--text);
    flex-shrink: 0; opacity: .9;
  }

  .status-list { display: flex; flex-direction: column; gap: 16px; }
  .status-item {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border-soft); padding-bottom: 12px;
  }
  .status-item:last-child { border-bottom: none; padding-bottom: 0; }
  .status-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted);
  }
  .status-value {
    font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .status-value.green { color: var(--success); }
  .status-value.yellow { color: var(--warn); }
  .status-value.red { color: var(--danger); }

  .price-list {
    display: flex; flex-direction: column; gap: 0; max-height: 400px;
    overflow-y: auto; padding-right: 8px;
    scrollbar-width: thin; scrollbar-color: var(--zero) transparent;
  }
  .price-list::-webkit-scrollbar { width: 6px; }
  .price-list::-webkit-scrollbar-track { background: transparent; }
  .price-list::-webkit-scrollbar-thumb { background: var(--zero); border-radius: 4px; }

  .price-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; padding: 12px 0;
    border-bottom: 1px solid var(--border-soft); gap: 16px;
  }
  .price-item:first-child { padding-top: 0; }
  .price-item:last-child { border-bottom: none; padding-bottom: 0; }
  .price-name {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); line-height: 1.4; flex: 1;
  }
  .price-amount {
    font-size: 15px; font-weight: 700; color: var(--success);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 20px; color: var(--muted); gap: 18px;
  }
  .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 260deg, var(--accent) 358deg, var(--accent-2) 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    background: var(--row-tint);
    border: 1px solid var(--danger-strip);
    color: var(--danger-text);
    padding: 20px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.6; margin-top: 20px; word-break: break-word;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .spinner { animation: pulse-opacity 1.6s ease-in-out infinite; }
    @keyframes pulse-opacity { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  }

  @media (max-width: 768px) {
    .container { padding: 16px 12px 32px; }
    header { flex-direction: column; }
    td:first-child, th:first-child { min-width: 8.5em; max-width: 9em; }
    td:first-child { min-width: 8.5em; }
    .dashboard-section { padding: 16px; }
    .stats-grid { grid-template-columns: 1fr; }
    .tab-btn { padding: 11px 18px; }
    #tableHeadTotals th { font-size: 13px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="students" role="tab" aria-selected="true">Мой ребенок</button>
      <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false">Статистика класса</button>
    </div>

    <div id="tab-students" role="tabpanel">
      <section class="table-section">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="search" id="search" placeholder="Введите 2+ буквы фамилии..." autocomplete="off" spellcheck="false" aria-label="Поиск по фамилии">
            </div>
            <span class="row-count" id="rowCount" aria-live="polite">Список скрыт</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
              <tr id="tableHeadTotals"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-stats" hidden role="tabpanel">
      <section class="dashboard-section">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Собрано всего</div>
            <div class="kpi-value green" id="kpi-collected">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Потрачено всего</div>
            <div class="kpi-value blue" id="kpi-spent">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Остаток в кассе</div>
            <div class="kpi-value" id="kpi-balance">0 ₽</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Статус сборов</div>
            <div class="status-list" id="paymentStats"></div>
          </div>
          <div class="stat-card">
            <div class="stat-title">На что потрачены деньги</div>
            <div class="price-list" id="expensesList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>

'use strict';

/* ==========================================================================
   1. СОСТОЯНИЕ
   ========================================================================== */

const SECRET_TOKEN = '#all#';

let globalData = {
  dataRows: [],
  headerRow: [],
  numericCols: [],
  totalCols: 0,
  statusColIndex: -1,
  remainingColIndex: -1
};

/* Кэш итогов. Пересчитывается ТОЛЬКО в parseData(). */
let globalTotals = {
  totals: [],
  collected: 0,
  spent: 0,
  expenseTotals: {}
};

let hasError = false;
let abortController = null;

/* ==========================================================================
   2. ОШИБКИ И ТАЙМАУТ
   ========================================================================== */

window.addEventListener('error', function (e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});

window.addEventListener('unhandledrejection', function (e) {
  const reason = e.reason;
  const msg = (reason && reason.message) || String(reason) || 'неизвестная ошибка';
  showError('Ошибка загрузки: ' + msg);
});

const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (15 сек). Проверьте интернет.');
}, 15000);

function showError(msg) {
  if (hasError) return;
  hasError = true;
  clearTimeout(loadTimeout);

  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = true;

  const el = document.getElementById('error');
  el.hidden = false;
  el.innerHTML = '<strong>Не удалось загрузить данные.</strong><br>Проверьте файлы в репозитории.<br><small></small>';
  el.querySelector('small').textContent = String(msg || 'неизвестная ошибка');
}

/* ==========================================================================
   3. ВКЛАДКИ
   ========================================================================== */

const VALID_TABS = ['students', 'stats'];

function switchTab(tabName) {
  if (VALID_TABS.indexOf(tabName) === -1) return;

  document.getElementById('tab-students').hidden = true;
  document.getElementById('tab-stats').hidden = true;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.setAttribute('aria-selected', 'false');
  });

  const activeBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.setAttribute('aria-selected', 'true');
  }

  if (tabName === 'students') {
    document.getElementById('tab-students').hidden = false;
  } else {
    document.getElementById('tab-stats').hidden = false;
  }
}

/* ==========================================================================
   4. УТИЛИТЫ
   ========================================================================== */

function safeParseNumber(val) {
  if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
  if (val === null || val === undefined || val === '') return 0;
  if (Object.prototype.toString.call(val) === '[object Date]') return 0;

  let s = String(val).replace(/[^\d.,-]/g, '');
  if (!s) return 0;

  const lastDot = s.lastIndexOf('.');
  const lastComma = s.lastIndexOf(',');

  if (lastDot >= 0 && lastComma >= 0) {
    if (lastDot > lastComma) {
      s = s.replace(/,/g, '');
    } else {
      s = s.replace(/\./g, '').replace(',', '.');
    }
  } else if (lastComma >= 0) {
    s = s.replace(',', '.');
  }

  const num = parseFloat(s);
  return Number.isFinite(num) ? num : 0;
}

function round2(num) {
  if (!Number.isFinite(num)) return 0;
  return Math.round(num * 100) / 100;
}

function formatNumber(v) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

function extractCellValue(v) {
  if (v === null || v === undefined) return '';
  const t = typeof v;
  if (t === 'number' || t === 'string' || t === 'boolean') return v;
  if (Object.prototype.toString.call(v) === '[object Date]') return v;

  if (v.richText) return v.richText.map(r => r.text || '').join('');

  if ('result' in v) {
    const r = v.result;
    if (r === null || r === undefined) return '';
    if (typeof r === 'object') {
      if (r.error) return '';
      if (r.richText) return r.richText.map(x => x.text || '').join('');
    }
    return r;
  }

  if ('error' in v) return '';
  if ('text' in v) return v.text;
  return '';
}

function getCellStatus(cell) {
  try {
    const fill = cell.fill;
    if (!fill || fill.type !== 'pattern' || fill.pattern !== 'solid') return 'debt';

    const fg = fill.fgColor;
    if (!fg) return 'debt';

    let rgb = '';
    if (fg.argb) rgb = String(fg.argb).toUpperCase();

    if (!rgb && fg.indexed !== undefined) {
      const map = { 42: 'C6EFCE', 43: 'FFEB9C', 44: 'FFC7CE' };
      rgb = map[fg.indexed] || '';
    }

    if (!rgb) return 'debt';
    if (rgb.length === 8 && rgb.startsWith('FF')) rgb = rgb.substring(2);

    if (rgb === 'C6EFCE') return 'paid';
    if (rgb === 'FFEB9C' || rgb === 'FFFF00') return 'excused';
    if (rgb === 'FFC7CE') return 'debt';
    return 'debt';
  } catch (e) {
    return 'debt';
  }
}

function isDebtCell(row, c) {
  return row[c].status === 'debt' && safeParseNumber(row[c].v) > 0;
}

/* ==========================================================================
   5. РАСЧЁТЫ
   ========================================================================== */

function computeTotals() {
  const { dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const totals = new Array(totalCols).fill(0);
  const expenseTotals = {};
  let collected = 0;
  let spent = 0;

  dataRows.forEach(row => {
    const paidVal = safeParseNumber(row[statusColIndex].v);
    totals[statusColIndex] = round2(totals[statusColIndex] + paidVal);
    collected = round2(collected + paidVal);

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status === 'excused') continue;

      const val = safeParseNumber(row[c].v);
      totals[c] = round2(totals[c] + val);
      expenseTotals[c] = round2((expenseTotals[c] || 0) + val);
      spent = round2(spent + val);
    }
  });

  totals[remainingColIndex] = round2(totals[statusColIndex] - spent);

  return { totals, collected, spent, expenseTotals };
}

function computeChildStats(row) {
  const { numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const childPaid = safeParseNumber(row[statusColIndex].v);
  let hasAnyPayment = childPaid > 0;
  let hasDebt = false;
  let childSpent = 0;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    if (row[c].status === 'excused') continue;

    const val = safeParseNumber(row[c].v);
    childSpent = round2(childSpent + val);

    if (val > 0) {
      if (row[c].status === 'paid') hasAnyPayment = true;
      else if (row[c].status === 'debt') hasDebt = true;
    }
  }

  return {
    childPaid,
    childSpent,
    childBalance: round2(childPaid - childSpent),
    hasAnyPayment,
    hasDebt
  };
}

/* ==========================================================================
   6. ЗАГРУЗКА
   ========================================================================== */

async function init() {
  hasError = false;
  abortController = new AbortController();

  try {
    if (typeof ExcelJS === 'undefined') {
      throw new Error('Библиотека exceljs.min.js не найдена.');
    }

    const resp = await fetch('data.xlsx', { cache: 'no-store', signal: abortController.signal });
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      if (!isNaN(d.getTime())) {
        const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastUpdated').textContent = 'Обновлено: ' + dateStr + ' в ' + timeStr;
      }
    }

    const buf = await resp.arrayBuffer();
    clearTimeout(loadTimeout);

    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);

    const ws = wb.worksheets[0];
    if (!ws) throw new Error('В файле нет листов');

    const columns = Math.max(1, ws.columnCount || 0);
    const rows = [];

    ws.eachRow({ includeEmpty: false }, (row) => {
      const cells = [];
      for (let c = 1; c <= columns; c++) {
        const cell = row.getCell(c);
        cells.push({
          v: extractCellValue(cell.value),
          status: getCellStatus(cell)
        });
      }
      rows.push(cells);
    });

    if (rows.length === 0) throw new Error('Файл не содержит данных.');

    parseData(rows, columns);

    if (!hasError) {
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
    }
  } catch (e) {
    clearTimeout(loadTimeout);
    if (e && e.name === 'AbortError') return;
    if (e && e.message === 'Failed to fetch') {
      showError('Нет подключения к интернету. Проверьте сеть.');
    } else {
      showError((e && e.message) || String(e) || 'неизвестная ошибка');
    }
  }
}

/* ==========================================================================
   7. ПАРСИНГ
   ========================================================================== */

function parseData(rows, totalCols) {
  if (!rows || rows.length === 0) throw new Error('Файл пуст.');

  const headerRow = rows[0].map(c => c.v);
  const dataRows = [];

  let statusColIndex = -1;
  let remainingColIndex = -1;

  headerRow.forEach((title, idx) => {
    const t = String(title || '').toLowerCase();
    if (t.includes('сдал') || t.includes('оплата') || t.includes('взнос')) statusColIndex = idx;
    if (t.includes('остаток') || t.includes('долг')) remainingColIndex = idx;
  });

  if (statusColIndex === -1) throw new Error('В шапке не найден столбец «Сдали»');
  if (remainingColIndex === -1) throw new Error('В шапке не найден столбец «Остаток»');
  if (statusColIndex === 0) throw new Error('Столбец «Сдали» не может быть первым — там ФИО');
  if (remainingColIndex === 0) throw new Error('Столбец «Остаток» не может быть первым — там ФИО');
  if (statusColIndex === remainingColIndex) throw new Error('Столбцы «Сдали» и «Остаток» совпадают — проверьте шапку');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;

    const name = String(r[0].v || '').trim();
    if (!name) continue;

    const lower = name.toLowerCase();
    if (lower.startsWith('итог') || lower === 'всего' || lower === 'общий') continue;
    if (!/[а-яёa-z]/i.test(name)) continue;

    dataRows.push(r);
  }

  if (dataRows.length === 0) throw new Error('Не найдено строк с именами детей.');

  const numericCols = [];
  for (let c = 1; c < totalCols; c++) {
    let hasNum = false;
    for (const row of dataRows) {
      if (typeof row[c].v === 'number') { hasNum = true; break; }
      if (typeof row[c].v === 'string' && /\d/.test(row[c].v)) { hasNum = true; break; }
    }
    if (hasNum) numericCols.push(c);
  }

  globalData = { dataRows, headerRow, numericCols, totalCols, statusColIndex, remainingColIndex };

  globalTotals = computeTotals();

  renderTable();
  renderStats();

  const searchInput = document.getElementById('search');
  if (!searchInput.dataset.listenerAttached) {
    searchInput.addEventListener('input', filterRows);
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterRows();
      }
    });
    searchInput.dataset.listenerAttached = '1';
  }
  filterRows();
}

/* ==========================================================================
   8. ТАБЛИЦА
   ========================================================================== */

function renderTable() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { totals } = globalTotals;

  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    if (numericSet.has(c) || c === statusColIndex || c === remainingColIndex) {
      th.classList.add('num');
      th.textContent = formatNumber(totals[c] || 0);
    }
    theadTotals.appendChild(th);
  }

  const fragment = document.createDocumentFragment();

  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden');

    const stats = computeChildStats(row);
    if (stats.hasDebt) tr.classList.add('row-unpaid');

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const isNum = numericSet.has(c);

      if (!isNum) {
        const s = row[c].v === '' || row[c].v == null ? '—' : String(row[c].v);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
        tr.appendChild(td);
        continue;
      }

      td.classList.add('num');

      if (c === remainingColIndex) {
        if (Math.abs(stats.childBalance) < 0.01) {
          td.textContent = '—';
          td.classList.add('zero');
        } else {
          td.textContent = formatNumber(stats.childBalance);
          if (stats.childBalance < 0) td.classList.add('negative');
        }
        tr.appendChild(td);
        continue;
      }

      const val = safeParseNumber(row[c].v);
      const status = row[c].status;

      if (status === 'excused') {
        td.textContent = String(row[c].v || 'б/н');
        td.classList.add('excused');
      } else if (val === 0) {
        td.textContent = '—';
        td.classList.add('zero');
        if (c === statusColIndex) td.classList.add('unpaid');
      } else {
        td.textContent = formatNumber(val);
        if (val < 0) td.classList.add('negative');
        if (c === statusColIndex) {
          td.classList.add('paid');
        } else if (c > 2 && isDebtCell(row, c)) {
          td.classList.add('cell-unpaid');
        }
      }

      tr.appendChild(td);
    }

    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment);
}

/* ==========================================================================
   9. ДАШБОРД
   ========================================================================== */

function renderStats() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { collected, spent, expenseTotals } = globalTotals;
  const balance = round2(collected - spent);

  document.getElementById('kpi-collected').textContent = formatNumber(collected) + ' ₽';
  document.getElementById('kpi-spent').textContent = formatNumber(spent) + ' ₽';

  const balanceEl = document.getElementById('kpi-balance');
  balanceEl.textContent = formatNumber(balance) + ' ₽';
  balanceEl.classList.toggle('red', balance < 0);

  let fullyPaid = 0, partiallyPaid = 0, notPaid = 0;

  dataRows.forEach(row => {
    const stats = computeChildStats(row);
    if (!stats.hasDebt) fullyPaid++;
    else if (stats.hasAnyPayment) partiallyPaid++;
    else notPaid++;
  });

  document.getElementById('paymentStats').innerHTML =
    '<div class="status-item">' +
      '<span class="status-label">Сдали всё</span>' +
      '<span class="status-value green">' + fullyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Сдали частично</span>' +
      '<span class="status-value yellow">' + partiallyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Пока не сдавали</span>' +
      '<span class="status-value red">' + notPaid + ' чел.</span>' +
    '</div>';

  const expensesEl = document.getElementById('expensesList');
  expensesEl.innerHTML = '';
  let hasExpenses = false;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    const totalAmount = expenseTotals[c] || 0;
    if (totalAmount <= 0) continue;

    hasExpenses = true;
    const div = document.createElement('div');
    div.className = 'price-item';

    const nameEl = document.createElement('span');
    nameEl.className = 'price-name';
    nameEl.textContent = headerRow[c] || ('Колонка ' + (c + 1));

    const amountEl = document.createElement('span');
    amountEl.className = 'price-amount';
    amountEl.textContent = formatNumber(totalAmount) + ' ₽';

    div.appendChild(nameEl);
    div.appendChild(amountEl);
    expensesEl.appendChild(div);
  }

  if (!hasExpenses) {
    expensesEl.innerHTML = '<div class="empty">Расходов пока нет</div>';
  }
}

/* ==========================================================================
   10. ПОИСК
   ========================================================================== */

function filterRows() {
  const input = document.getElementById('search');
  const q = input.value.trim().toLowerCase();
  const rowCountEl = document.getElementById('rowCount');
  const rows = document.querySelectorAll('#tableBody tr');

  if (SECRET_TOKEN && q === SECRET_TOKEN.toLowerCase()) {
    rows.forEach(tr => tr.classList.remove('hidden'));
    rowCountEl.textContent = 'Все записи (' + rows.length + ')';
    rowCountEl.classList.add('accountant-mode');
    return;
  }

  rowCountEl.classList.remove('accountant-mode');

  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    rowCountEl.textContent = 'Список скрыт';
    return;
  }

  let found = 0;
  rows.forEach(tr => {
    const nameCell = tr.cells[0];
    if (nameCell && nameCell.textContent.toLowerCase().includes(q)) {
      tr.classList.remove('hidden');
      found++;
    } else {
      tr.classList.add('hidden');
    }
  });

  rowCountEl.textContent = found > 0 ? ('Найдено: ' + found) : 'Не найдено';
}

/* ==========================================================================
   11. ПРИВЯЗКА ВКЛАДОК
   ========================================================================== */

document.querySelectorAll('.tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    switchTab(btn.dataset.tab);
  });
});

/* ==========================================================================
   12. СТАРТ
   ========================================================================== */

init();
</script>
