<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт родительского комитета</title>
<!-- Локальная библиотека (должна лежать в репозитории) -->
<script src="xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --border-soft: #f1f5f9;
    --accent: #6366f1; --success: #16a34a; --danger: #dc2626;
    --radius: 12px; --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px -1px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  
  [hidden] { display: none !important; }

  .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 24px 32px 48px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0; }
  header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }

  .table-section {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden;
  }
  .toolbar {
    padding: 16px 20px; border-bottom: 1px solid var(--border-soft);
    display: flex; flex-direction: column; gap: 8px;
  }
  
  .search-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  
  .search-wrap { position: relative; flex: 1; min-width: 250px; max-width: 500px; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--muted); pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 9px 12px 9px 36px; font-size: 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search-wrap input:focus {
    outline: none; border-color: var(--accent); background: var(--card);
    box-shadow: 0 0 0 3px rgba(99,102,241,.1);
  }
  .row-count { font-size: 13px; color: var(--muted); margin-left: auto; }
  
  .hint {
    font-size: 13px; color: var(--accent); font-weight: 500; margin-left: 36px;
  }

  .table-wrapper { overflow-x: auto; width: 100%; max-height: 80vh; }
  
  table { width: auto; min-width: 100%; border-collapse: collapse; font-size: 14px; }
  
  thead { position: sticky; top: 0; z-index: 10; }
  th {
    background: #f8fafc; color: var(--muted); font-weight: 600;
    text-align: left; padding: 12px 16px; font-size: 12px;
    text-transform: uppercase; letter-spacing: .04em;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    user-select: none;
  }

  #tableHeadTotals th {
    background: #f1f5f9; color: var(--text); font-weight: 700;
    text-transform: none; font-size: 14px; padding: 10px 16px;
    border-bottom: 2px solid var(--border);
  }
  #tableHeadTotals th.num { color: var(--success); font-size: 15px; }

  td { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  tbody tr { transition: background .1s; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.hidden { display: none !important; }

  tbody tr.row-unpaid { background-color: #fff1f2 !important; }
  tbody tr.row-unpaid:hover { background-color: #ffe4e6 !important; }
  td.cell-unpaid { background-color: #ffe4e6; color: var(--danger) !important; font-weight: 600; }

  th.num, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }
  td.zero { color: #cbd5e1; }
  td.negative { color: var(--danger); }
  td.paid { color: var(--success); font-weight: 600; }
  td.unpaid { color: var(--danger); font-weight: 600; }

  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 20px; color: var(--muted); gap: 16px;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    padding: 20px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.6; margin-top: 20px;
    word-break: break-word;
  }
  .error code { background: rgba(153,27,27,.08); padding: 2px 6px; border-radius: 4px; font-weight: 600; }

  @media (max-width: 768px) {
    .container { padding: 16px 12px; }
    header { flex-direction: column; }
    .row-count { margin: 8px 0 0; text-align: right; width: 100%; }
    #tableHeadTotals th { font-size: 13px; padding: 8px 12px; }
    .hint { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>
    <section class="table-section">
      <div class="toolbar">
        <div class="search-row">
          <div class="search-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="search" id="search" placeholder="Введите фамилию ребенка..." autocomplete="off">
          </div>
          <span class="row-count" id="rowCount">Список скрыт</span>
        </div>
        <div class="hint" id="searchHint">Введите минимум 2 буквы фамилии или имени, чтобы увидеть данные ребенка.</div>
      </div>
      <div class="table-wrapper">
        <table id="dataTable">
          <thead>
            <tr id="tableHead"></tr>
            <tr id="tableHeadTotals"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script>
// ГЛОБАЛЬНЫЙ ПЕРЕХВАТЧИК ОШИБОК
window.addEventListener('error', function(e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});
window.addEventListener('unhandledrejection', function(e) {
  showError('Ошибка загрузки: ' + (e.reason?.message || e.reason || 'неизвестная ошибка'));
});

// ТАЙМАУТ И ОБРЫВ ЗАПРОСА
let abortController = null;
const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (10 сек). Проверьте интернет или наличие файла data.xlsx.');
}, 10000);

function showError(msg) {
  clearTimeout(loadTimeout);
  const loading = document.getElementById('loading');
  if (loading) loading.hidden = true;
  const content = document.getElementById('content');
  if (content) content.hidden = true;
  
  const el = document.getElementById('error');
  if (el) {
    el.hidden = false;
    el.innerHTML = `
      <strong>Не удалось загрузить данные.</strong><br>
      Проверьте: <br>
      1. Файл <code>data.xlsx</code> загружен в репозиторий.<br>
      2. Файл <code>xlsx.full.min.js</code> загружен в репозиторий.<br>
      3. Вы обновили страницу.<br>
      <hr style="border:0; border-top: 1px solid #fecaca; margin: 10px 0;">
      <small style="opacity:.8;">Техническая информация: ${msg}</small>
    `;
  }
}

const CONFIG = {
  dataFile: 'data.xlsx',
  title: 'Отчёт родительского комитета'
};

// Ультра-безопасная конвертация в число (убирает пробелы, запятые, невидимые символы)
function cleanNumber(val) {
  if (typeof val === 'number') return val;
  if (val === null || val === undefined || val === '') return NaN;
  // Убираем все виды пробелов (включая неразрывный \u00A0) и меняем запятую на точку
  const str = String(val).replace(/[\s\u00A0]/g, '').replace(',', '.');
  return parseFloat(str);
}

async function init() {
  document.getElementById('pageTitle').textContent = CONFIG.title;
  abortController = new AbortController();

  try {
    if (typeof XLSX === 'undefined') {
      throw new Error('Библиотека xlsx.full.min.js не найдена в репозитории.');
    }

    const resp = await fetch(CONFIG.dataFile, { 
      cache: 'no-store',
      signal: abortController.signal 
    });
    
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
      document.getElementById('lastUpdated').textContent = `Обновлено: ${dateStr} в ${timeStr}`;
    }

    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellFormula: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    if (!ws) throw new Error('В файле нет листов');

    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: true });
    render(rows);
    
    clearTimeout(loadTimeout);
    document.getElementById('loading').hidden = true;
    document.getElementById('content').hidden = false;

  } catch (e) {
    if (e.name === 'AbortError') return; // Игнорируем ошибку, если это сработал наш таймер
    showError(e.message);
  }
}

function render(rows) {
  if (!rows || rows.length === 0) {
    throw new Error('Файл пуст.');
  }

  let headerRow = rows[0] || [];
  
  // Обрезаем столбцы, если в заголовке пусто
  let totalCols = headerRow.length;
  while (totalCols > 0 && (!headerRow[totalCols - 1] || String(headerRow[totalCols - 1]).trim() === '')) {
    totalCols--;
  }
  if (totalCols === 0) totalCols = Math.max(headerRow.length, ...rows.map(r => (r || []).length));

  const dataRows = [];
  let totalsRow = null;

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;

    const firstCol = String(r[0] || '').trim();
    const lowerRowText = r.join(' ').toLowerCase();
    
    // Надежный поиск строки Итогов (по словам или по пустой первой ячейке с числами)
    if (lowerRowText.includes('итог') || lowerRowText.includes('всего') || lowerRowText.includes('общий')) {
      totalsRow = r;
      continue;
    }
    if (firstCol === '' && r.some(c => typeof c === 'number')) {
      totalsRow = r;
      continue;
    }

    // Если есть текст в первой колонке — это ученик
    if (firstCol !== '' && /[a-zA-Zа-яА-Я]/.test(firstCol)) {
      dataRows.push(r);
    }
  }

  if (dataRows.length === 0) {
    throw new Error('Не найдено строк с именами.');
  }

  // Определяем числовые столбцы
  const numericCols = [];
  for (let c = 1; c < totalCols; c++) { 
    if (isNumericColumn(dataRows, c)) numericCols.push(c);
  }
  
  // Ищем столбцы "Сдали" и "Остаток"
  let statusColIndex = -1;
  let remainingColIndex = -1;
  for (let c = 0; c < totalCols; c++) {
    const title = String(headerRow[c] || '').toLowerCase();
    if (title.includes('сдал') || title.includes('оплата') || title.includes('взнос')) statusColIndex = c;
    if (title.includes('остаток') || title.includes('долг')) remainingColIndex = c;
  }

  renderTable(headerRow, dataRows, totalsRow, totalCols, numericCols, statusColIndex, remainingColIndex);
  
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', filterRows);
  
  // Изначально скрываем всех
  filterRows();
}

function isNumericColumn(rows, colIndex) {
  let numCount = 0;
  let validCount = 0;
  for (const row of rows) {
    const val = row[colIndex];
    if (val === '' || val == null) continue;
    validCount++;
    if (!isNaN(cleanNumber(val))) numCount++;
  }
  // Если хотя бы 30% заполненных ячеек — числа, считаем колонку числовой
  return validCount > 0 && (numCount / validCount) >= 0.3;
}

function renderTable(headerRow, dataRows, totalsRow, totalCols, numericCols, statusColIndex, remainingColIndex) {
  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');
  const numericSet = new Set(numericCols);

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  const finalTotals = totalsRow || computeTotals(dataRows, totalCols);

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    const val = finalTotals[c];
    if (numericSet.has(c) && typeof val === 'number' && !isNaN(val)) {
      th.classList.add('num');
      th.textContent = formatNumber(val);
    } else {
      th.textContent = '';
    }
    theadTotals.appendChild(th);
  }

  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden'); 
    
    // Логика долгов: проверяем только столбцы расходов
    let isRowUnpaid = false;
    for (let c = 1; c < totalCols; c++) {
      if (c === statusColIndex || c === remainingColIndex) continue;
      if (!numericSet.has(c)) continue;

      const num = cleanNumber(row[c]);
      if (isNaN(num) || Math.abs(num) < 0.01) {
        isRowUnpaid = true;
      }
    }

    if (isRowUnpaid) tr.classList.add('row-unpaid');

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const val = row[c];
      const isNum = numericSet.has(c);

      if (isNum) {
        td.classList.add('num');
        let num = cleanNumber(val);
        if (isNaN(num)) num = 0;

        if (Math.abs(num) < 0.01) {
          td.textContent = '—';
          td.classList.add('zero');
          
          if (c === statusColIndex) {
            td.classList.add('unpaid'); 
          } else if (c !== remainingColIndex) {
            td.classList.add('cell-unpaid');
          }
        } else {
          td.textContent = formatNumber(num);
          if (num < 0) td.classList.add('negative');
          if (c === statusColIndex) td.classList.add('paid');
        }
      } else {
        const s = val === '' || val == null ? '—' : String(val);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

function computeTotals(dataRows, totalCols) {
  const totals = [];
  for (let c = 0; c < totalCols; c++) {
    let sum = 0, hasValue = false;
    dataRows.forEach(r => {
      const num = cleanNumber(r[c]);
      if (!isNaN(num)) { sum += num; hasValue = true; }
    });
    totals[c] = hasValue ? sum : '';
  }
  return totals;
}

function filterRows() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const rows = document.querySelectorAll('#tableBody tr');
  const hint = document.getElementById('searchHint');
  
  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    hint.style.display = 'block';
    document.getElementById('rowCount').textContent = 'Список скрыт';
    return;
  }

  hint.style.display = 'none';
  let found = 0;
  
  rows.forEach(tr => {
    // Ищем СТРОГО в первой ячейке (ФИО), чтобы не показывать всех подряд по цифрам
    const nameCell = tr.cells[0];
    const isMatch = nameCell && nameCell.textContent.toLowerCase().includes(q);
    
    if (isMatch) {
      tr.classList.remove('hidden');
      found++;
    } else {
      tr.classList.add('hidden');
    }
  });
  
  document.getElementById('rowCount').textContent = found > 0 ? `Найдено: ${found}` : 'Не найдено';
}

function formatNumber(v) {
  if (typeof v !== 'number' || !isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  const rounded = Math.round(v * 100) / 100;
  return rounded.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

init();
</script>
</body>
</html>
