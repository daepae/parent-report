<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Отчёт родительского комитета</title>

<!-- ExcelJS — чтение xlsx с сохранением цветов заливки -->
<script src="exceljs.min.js"></script>

<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb; --bg-glow: rgba(99,102,241,.10);
    --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --border: #e6e9f2; --border-soft: #eef1f7;
    --accent: #6366f1; --accent-soft: rgba(99,102,241,.14);
    --success: #16a34a; --success-bg: #e9f9ef;
    --danger: #dc2626; --danger-bg: #fdeaea;
    --warn: #b45309; --warn-bg: #fdf3dd;
    --seg-bg: #eceef6; --head-bg: rgba(255,255,255,.92);
    --radius: 16px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --bg-glow: rgba(99,102,241,.16);
      --card: #141a2e; --text: #e7eaf6; --muted: #93a0bd;
      --border: #262f4d; --border-soft: #1c2340;
      --accent: #818cf8; --accent-soft: rgba(129,140,248,.22);
      --success: #34d399; --success-bg: rgba(52,211,153,.14);
      --danger: #f87171; --danger-bg: rgba(248,113,113,.14);
      --warn: #fbbf24; --warn-bg: rgba(251,191,36,.14);
      --seg-bg: #1a2140; --head-bg: rgba(20,26,46,.92);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg) radial-gradient(1200px 320px at 50% -80px, var(--bg-glow), transparent 70%) no-repeat;
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

  header h1 {
    margin: 0; font-size: clamp(20px, 4.5vw, 26px); font-weight: 800; letter-spacing: -.02em;
  }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  /* --- tabs: segmented pills --- */
  .tabs {
    display: flex; gap: 4px; margin: 20px 0 16px;
    background: var(--seg-bg); border-radius: 999px; padding: 4px;
    width: max-content; max-width: 100%;
  }
  .tab-btn {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 10px 20px; min-height: 44px; border-radius: 999px;
    cursor: pointer; transition: color .15s, background .15s, box-shadow .15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    background: var(--card); color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  /* --- toolbar / search --- */
  .toolbar { margin-bottom: 14px; }
  .search-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .search-wrap { position: relative; flex: 1; max-width: 440px; }
  .search-wrap svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--muted); pointer-events: none;
  }
  #search {
    width: 100%; min-height: 44px; font: inherit; font-size: 14px; color: var(--text);
    padding: 0 18px 0 44px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    transition: border-color .15s, box-shadow .15s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .row-count.accountant-mode { color: var(--accent); font-weight: 700; }
  .hidden { display: none !important; }

  /* --- table --- */
  .table-wrapper {
    overflow: auto; max-height: calc(100vh - 190px);
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card); box-shadow: var(--shadow-sm);
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .table-wrapper::-webkit-scrollbar { height: 8px; width: 8px; }
  .table-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--head-bg);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    padding: 12px 14px; text-align: right;
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); white-space: normal; vertical-align: bottom;
    border-bottom: 1px solid var(--border);
  }
  thead th:first-child, td:first-child {
    position: sticky; left: 0; text-align: left; z-index: 3;
  }
  thead th:first-child {
    background: var(--head-bg);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: inset -1px 0 0 var(--border);
  }
  td {
    padding: 10px 14px; text-align: right; font-size: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  td:first-child {
    background: var(--card); font-weight: 600;
    box-shadow: inset -1px 0 0 var(--border);
    max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* status colors (contract: fills only) */
  .paid   { background: var(--success-bg); color: var(--success); font-weight: 600; }
  .excused{ background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .unpaid, .cell-unpaid { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
  .zero   { color: var(--muted); }
  .negative { color: var(--danger); font-weight: 700; }
  tr.row-unpaid td { background: var(--danger-bg); }
  tr.row-unpaid td:first-child { background: var(--danger-bg); color: var(--danger); }

  /* --- KPI cards --- */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow-sm);
    transition: transform .15s, box-shadow .15s;
  }
  .kpi-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .kpi-label {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em;
  }
  .kpi-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .kpi-card:nth-child(1) .kpi-label::before { background: var(--success); }
  .kpi-card:nth-child(3) .kpi-label::before { background: var(--warn); }
  .kpi-value { margin-top: 6px; font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi-value.green { color: var(--success); }
  .kpi-value.blue  { color: var(--accent); }
  .kpi-value.red   { color: var(--danger); }
  .kpi-value.yellow{ color: var(--warn); }

  /* --- stats grid --- */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow-sm);
  }
  .stat-title { margin-bottom: 12px; font-size: 15px; font-weight: 700; }
  .status-item, .price-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 7px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px;
  }
  .status-item:last-child, .price-item:last-child { border-bottom: 0; }
  .status-label, .price-name { color: var(--text); }
  .status-value, .price-amount { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

  /* --- loading / error --- */
  .loading { text-align: center; padding: 64px 0; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 14px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 270deg, var(--accent) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
    mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
    .kpi-card, .tab-btn { transition: none; }
  }
  .error {
    background: var(--danger-bg); color: var(--danger);
    border: 1px solid var(--danger); border-radius: var(--radius);
    padding: 14px 18px; margin: 20px 0; font-size: 14px;
  }

  /* --- mobile-first adjustments --- */
  @media (max-width: 767px) {
    .container { padding: 16px 12px 40px; }
    .tabs { width: 100%; margin: 16px 0 12px; }
    .tab-btn { flex: 1; padding: 10px 8px; }
    .search-row { flex-direction: column; align-items: stretch; gap: 8px; }
    .search-wrap { max-width: none; }
    #search { font-size: 16px; } /* iOS: no auto-zoom */
    .row-count { text-align: right; }
    .table-wrapper { max-height: calc(100vh - 150px); }
    thead th { font-size: 10px; padding: 9px 10px; }
    td { font-size: 13px; padding: 8px 10px; }
    td:first-child { max-width: 130px; }
    .stats-grid { grid-template-columns: 1fr; }
    .kpi-card { padding: 14px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1 id="pageTitle">Отчёт родительского комитета</h1>
      <p class="subtitle" id="lastUpdated"></p>
    </div>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаем данные…</p>
  </div>

  <div id="error" class="error" hidden></div>

  <div id="content" hidden>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="students" role="tab" aria-selected="true">Мой ребенок</button>
      <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false">Статистика класса</button>
    </div>

    <div id="tab-students" role="tabpanel">
      <section class="table-section">
        <div class="toolbar">
          <div class="search-row">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="search" id="search" placeholder="Введите 2+ буквы фамилии..." autocomplete="off" spellcheck="false" aria-label="Поиск по фамилии">
            </div>
            <span class="row-count" id="rowCount" aria-live="polite">Список скрыт</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
              <tr id="tableHeadTotals"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="tab-stats" hidden role="tabpanel">
      <section class="dashboard-section">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Собрано всего</div>
            <div class="kpi-value green" id="kpi-collected">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Потрачено всего</div>
            <div class="kpi-value blue" id="kpi-spent">0 ₽</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Остаток в кассе</div>
            <div class="kpi-value" id="kpi-balance">0 ₽</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Статус сборов</div>
            <div class="status-list" id="paymentStats"></div>
          </div>
          <div class="stat-card">
            <div class="stat-title">На что потрачены деньги</div>
            <div class="price-list" id="expensesList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
'use strict';

/* ==========================================================================
   1. СОСТОЯНИЕ
   ========================================================================== */

const SECRET_TOKEN = '#all#';

let globalData = {
  dataRows: [],
  headerRow: [],
  numericCols: [],
  totalCols: 0,
  statusColIndex: -1,
  remainingColIndex: -1
};

/* Кэш итогов. Пересчитывается ТОЛЬКО в parseData(). */
let globalTotals = {
  totals: [],
  collected: 0,
  spent: 0,
  expenseTotals: {}
};

let hasError = false;
let abortController = null;

/* ==========================================================================
   2. ОШИБКИ И ТАЙМАУТ
   ========================================================================== */

window.addEventListener('error', function (e) {
  showError('Ошибка в скрипте: ' + (e.message || 'неизвестная ошибка'));
});

window.addEventListener('unhandledrejection', function (e) {
  const reason = e.reason;
  const msg = (reason && reason.message) || String(reason) || 'неизвестная ошибка';
  showError('Ошибка загрузки: ' + msg);
});

const loadTimeout = setTimeout(() => {
  if (abortController) abortController.abort();
  showError('Превышено время ожидания (15 сек). Проверьте интернет.');
}, 15000);

function showError(msg) {
  if (hasError) return;
  hasError = true;
  clearTimeout(loadTimeout);

  document.getElementById('loading').hidden = true;
  document.getElementById('content').hidden = true;

  const el = document.getElementById('error');
  el.hidden = false;
  el.innerHTML = '<strong>Не удалось загрузить данные.</strong><br>Проверьте файлы в репозитории.<br><small></small>';
  el.querySelector('small').textContent = String(msg || 'неизвестная ошибка');
}

/* ==========================================================================
   3. ВКЛАДКИ
   ========================================================================== */

const VALID_TABS = ['students', 'stats'];

function switchTab(tabName) {
  if (VALID_TABS.indexOf(tabName) === -1) return;

  document.getElementById('tab-students').hidden = true;
  document.getElementById('tab-stats').hidden = true;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.setAttribute('aria-selected', 'false');
  });

  const activeBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.setAttribute('aria-selected', 'true');
  }

  if (tabName === 'students') {
    document.getElementById('tab-students').hidden = false;
  } else {
    document.getElementById('tab-stats').hidden = false;
  }
}

/* ==========================================================================
   4. УТИЛИТЫ
   ========================================================================== */

function safeParseNumber(val) {
  if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
  if (val === null || val === undefined || val === '') return 0;
  if (Object.prototype.toString.call(val) === '[object Date]') return 0;

  let s = String(val).replace(/[^\d.,-]/g, '');
  if (!s) return 0;

  const lastDot = s.lastIndexOf('.');
  const lastComma = s.lastIndexOf(',');

  if (lastDot >= 0 && lastComma >= 0) {
    if (lastDot > lastComma) {
      s = s.replace(/,/g, '');
    } else {
      s = s.replace(/\./g, '').replace(',', '.');
    }
  } else if (lastComma >= 0) {
    s = s.replace(',', '.');
  }

  const num = parseFloat(s);
  return Number.isFinite(num) ? num : 0;
}

function round2(num) {
  if (!Number.isFinite(num)) return 0;
  return Math.round(num * 100) / 100;
}

function formatNumber(v) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return '0';
  if (Math.abs(v) < 0.01) return '0';
  return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

function extractCellValue(v) {
  if (v === null || v === undefined) return '';
  const t = typeof v;
  if (t === 'number' || t === 'string' || t === 'boolean') return v;
  if (Object.prototype.toString.call(v) === '[object Date]') return v;

  if (v.richText) return v.richText.map(r => r.text || '').join('');

  if ('result' in v) {
    const r = v.result;
    if (r === null || r === undefined) return '';
    if (typeof r === 'object') {
      if (r.error) return '';
      if (r.richText) return r.richText.map(x => x.text || '').join('');
    }
    return r;
  }

  if ('error' in v) return '';
  if ('text' in v) return v.text;
  return '';
}

function getCellStatus(cell) {
  try {
    const fill = cell.fill;
    if (!fill || fill.type !== 'pattern' || fill.pattern !== 'solid') return 'debt';

    const fg = fill.fgColor;
    if (!fg) return 'debt';

    let rgb = '';
    if (fg.argb) rgb = String(fg.argb).toUpperCase();

    if (!rgb && fg.indexed !== undefined) {
      const map = { 42: 'C6EFCE', 43: 'FFEB9C', 44: 'FFC7CE' };
      rgb = map[fg.indexed] || '';
    }

    if (!rgb) return 'debt';
    if (rgb.length === 8 && rgb.startsWith('FF')) rgb = rgb.substring(2);

    if (rgb === 'C6EFCE') return 'paid';
    if (rgb === 'FFEB9C' || rgb === 'FFFF00') return 'excused';
    if (rgb === 'FFC7CE') return 'debt';
    return 'debt';
  } catch (e) {
    return 'debt';
  }
}

function isDebtCell(row, c) {
  return row[c].status === 'debt' && safeParseNumber(row[c].v) > 0;
}

/* ==========================================================================
   5. РАСЧЁТЫ
   ========================================================================== */

function computeTotals() {
  const { dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const totals = new Array(totalCols).fill(0);
  const expenseTotals = {};
  let collected = 0;
  let spent = 0;

  dataRows.forEach(row => {
    const paidVal = safeParseNumber(row[statusColIndex].v);
    totals[statusColIndex] = round2(totals[statusColIndex] + paidVal);
    collected = round2(collected + paidVal);

    for (let c = 3; c < totalCols; c++) {
      if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
      if (row[c].status === 'excused') continue;

      const val = safeParseNumber(row[c].v);
      totals[c] = round2(totals[c] + val);
      expenseTotals[c] = round2((expenseTotals[c] || 0) + val);
      spent = round2(spent + val);
    }
  });

  totals[remainingColIndex] = round2(totals[statusColIndex] - spent);

  return { totals, collected, spent, expenseTotals };
}

function computeChildStats(row) {
  const { numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);

  const childPaid = safeParseNumber(row[statusColIndex].v);
  let hasAnyPayment = childPaid > 0;
  let hasDebt = false;
  let childSpent = 0;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    if (row[c].status === 'excused') continue;

    const val = safeParseNumber(row[c].v);
    childSpent = round2(childSpent + val);

    if (val > 0) {
      if (row[c].status === 'paid') hasAnyPayment = true;
      else if (row[c].status === 'debt') hasDebt = true;
    }
  }

  return {
    childPaid,
    childSpent,
    childBalance: round2(childPaid - childSpent),
    hasAnyPayment,
    hasDebt
  };
}

/* ==========================================================================
   6. ЗАГРУЗКА
   ========================================================================== */

async function init() {
  hasError = false;
  abortController = new AbortController();

  try {
    if (typeof ExcelJS === 'undefined') {
      throw new Error('Библиотека exceljs.min.js не найдена.');
    }

    const resp = await fetch('data.xlsx', { cache: 'no-store', signal: abortController.signal });
    if (!resp.ok) throw new Error('Файл не найден (HTTP ' + resp.status + ')');

    const lm = resp.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      if (!isNaN(d.getTime())) {
        const dateStr = d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastUpdated').textContent = 'Обновлено: ' + dateStr + ' в ' + timeStr;
      }
    }

    const buf = await resp.arrayBuffer();
    clearTimeout(loadTimeout);

    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);

    const ws = wb.worksheets[0];
    if (!ws) throw new Error('В файле нет листов');

    const columns = Math.max(1, ws.columnCount || 0);
    const rows = [];

    ws.eachRow({ includeEmpty: false }, (row) => {
      const cells = [];
      for (let c = 1; c <= columns; c++) {
        const cell = row.getCell(c);
        cells.push({
          v: extractCellValue(cell.value),
          status: getCellStatus(cell)
        });
      }
      rows.push(cells);
    });

    if (rows.length === 0) throw new Error('Файл не содержит данных.');

    parseData(rows, columns);

    if (!hasError) {
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
    }
  } catch (e) {
    clearTimeout(loadTimeout);
    if (e && e.name === 'AbortError') return;
    if (e && e.message === 'Failed to fetch') {
      showError('Нет подключения к интернету. Проверьте сеть.');
    } else {
      showError((e && e.message) || String(e) || 'неизвестная ошибка');
    }
  }
}

/* ==========================================================================
   7. ПАРСИНГ
   ========================================================================== */

function parseData(rows, totalCols) {
  if (!rows || rows.length === 0) throw new Error('Файл пуст.');

  const headerRow = rows[0].map(c => c.v);
  const dataRows = [];

  let statusColIndex = -1;
  let remainingColIndex = -1;

  headerRow.forEach((title, idx) => {
    const t = String(title || '').toLowerCase();
    if (t.includes('сдал') || t.includes('оплата') || t.includes('взнос')) statusColIndex = idx;
    if (t.includes('остаток') || t.includes('долг')) remainingColIndex = idx;
  });

  if (statusColIndex === -1) throw new Error('В шапке не найден столбец «Сдали»');
  if (remainingColIndex === -1) throw new Error('В шапке не найден столбец «Остаток»');
  if (statusColIndex === 0) throw new Error('Столбец «Сдали» не может быть первым — там ФИО');
  if (remainingColIndex === 0) throw new Error('Столбец «Остаток» не может быть первым — там ФИО');
  if (statusColIndex === remainingColIndex) throw new Error('Столбцы «Сдали» и «Остаток» совпадают — проверьте шапку');

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length === 0) continue;

    const name = String(r[0].v || '').trim();
    if (!name) continue;

    const lower = name.toLowerCase();
    if (lower.startsWith('итог') || lower === 'всего' || lower === 'общий') continue;
    if (!/[а-яёa-z]/i.test(name)) continue;

    dataRows.push(r);
  }

  if (dataRows.length === 0) throw new Error('Не найдено строк с именами детей.');

  const numericCols = [];
  for (let c = 1; c < totalCols; c++) {
    let hasNum = false;
    for (const row of dataRows) {
      if (typeof row[c].v === 'number') { hasNum = true; break; }
      if (typeof row[c].v === 'string' && /\d/.test(row[c].v)) { hasNum = true; break; }
    }
    if (hasNum) numericCols.push(c);
  }

  globalData = { dataRows, headerRow, numericCols, totalCols, statusColIndex, remainingColIndex };

  globalTotals = computeTotals();

  renderTable();
  renderStats();

  const searchInput = document.getElementById('search');
  if (!searchInput.dataset.listenerAttached) {
    searchInput.addEventListener('input', filterRows);
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterRows();
      }
    });
    searchInput.dataset.listenerAttached = '1';
  }
  filterRows();
}

/* ==========================================================================
   8. ТАБЛИЦА
   ========================================================================== */

function renderTable() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { totals } = globalTotals;

  const theadMain = document.getElementById('tableHead');
  const theadTotals = document.getElementById('tableHeadTotals');
  const tbody = document.getElementById('tableBody');

  theadMain.innerHTML = '';
  theadTotals.innerHTML = '';
  tbody.innerHTML = '';

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    th.textContent = String(headerRow[c] || '');
    if (numericSet.has(c)) th.classList.add('num');
    theadMain.appendChild(th);
  }

  for (let c = 0; c < totalCols; c++) {
    const th = document.createElement('th');
    if (numericSet.has(c) || c === statusColIndex || c === remainingColIndex) {
      th.classList.add('num');
      th.textContent = formatNumber(totals[c] || 0);
    }
    theadTotals.appendChild(th);
  }

  const fragment = document.createDocumentFragment();

  dataRows.forEach(row => {
    const tr = document.createElement('tr');
    tr.classList.add('hidden');

    const stats = computeChildStats(row);
    if (stats.hasDebt) tr.classList.add('row-unpaid');

    for (let c = 0; c < totalCols; c++) {
      const td = document.createElement('td');
      const isNum = numericSet.has(c);

      if (!isNum) {
        const s = row[c].v === '' || row[c].v == null ? '—' : String(row[c].v);
        td.textContent = s;
        if (s === '—') td.classList.add('zero');
        tr.appendChild(td);
        continue;
      }

      td.classList.add('num');

      if (c === remainingColIndex) {
        if (Math.abs(stats.childBalance) < 0.01) {
          td.textContent = '—';
          td.classList.add('zero');
        } else {
          td.textContent = formatNumber(stats.childBalance);
          if (stats.childBalance < 0) td.classList.add('negative');
        }
        tr.appendChild(td);
        continue;
      }

      const val = safeParseNumber(row[c].v);
      const status = row[c].status;

      if (status === 'excused') {
        td.textContent = String(row[c].v || 'б/н');
        td.classList.add('excused');
      } else if (val === 0) {
        td.textContent = '—';
        td.classList.add('zero');
        if (c === statusColIndex) td.classList.add('unpaid');
      } else {
        td.textContent = formatNumber(val);
        if (val < 0) td.classList.add('negative');
        if (c === statusColIndex) {
          td.classList.add('paid');
        } else if (c > 2 && isDebtCell(row, c)) {
          td.classList.add('cell-unpaid');
        }
      }

      tr.appendChild(td);
    }

    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment);
}

/* ==========================================================================
   9. ДАШБОРД
   ========================================================================== */

function renderStats() {
  const { headerRow, dataRows, numericCols, totalCols, statusColIndex, remainingColIndex } = globalData;
  const numericSet = new Set(numericCols);
  const { collected, spent, expenseTotals } = globalTotals;
  const balance = round2(collected - spent);

  document.getElementById('kpi-collected').textContent = formatNumber(collected) + ' ₽';
  document.getElementById('kpi-spent').textContent = formatNumber(spent) + ' ₽';

  const balanceEl = document.getElementById('kpi-balance');
  balanceEl.textContent = formatNumber(balance) + ' ₽';
  balanceEl.classList.toggle('red', balance < 0);

  let fullyPaid = 0, partiallyPaid = 0, notPaid = 0;

  dataRows.forEach(row => {
    const stats = computeChildStats(row);
    if (!stats.hasDebt) fullyPaid++;
    else if (stats.hasAnyPayment) partiallyPaid++;
    else notPaid++;
  });

  document.getElementById('paymentStats').innerHTML =
    '<div class="status-item">' +
      '<span class="status-label">Сдали всё</span>' +
      '<span class="status-value green">' + fullyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Сдали частично</span>' +
      '<span class="status-value yellow">' + partiallyPaid + ' чел.</span>' +
    '</div>' +
    '<div class="status-item">' +
      '<span class="status-label">Пока не сдавали</span>' +
      '<span class="status-value red">' + notPaid + ' чел.</span>' +
    '</div>';

  const expensesEl = document.getElementById('expensesList');
  expensesEl.innerHTML = '';
  let hasExpenses = false;

  for (let c = 3; c < totalCols; c++) {
    if (!numericSet.has(c) || c === statusColIndex || c === remainingColIndex) continue;
    const totalAmount = expenseTotals[c] || 0;
    if (totalAmount <= 0) continue;

    hasExpenses = true;
    const div = document.createElement('div');
    div.className = 'price-item';

    const nameEl = document.createElement('span');
    nameEl.className = 'price-name';
    nameEl.textContent = headerRow[c] || ('Колонка ' + (c + 1));

    const amountEl = document.createElement('span');
    amountEl.className = 'price-amount';
    amountEl.textContent = formatNumber(totalAmount) + ' ₽';

    div.appendChild(nameEl);
    div.appendChild(amountEl);
    expensesEl.appendChild(div);
  }

  if (!hasExpenses) {
    expensesEl.innerHTML = '<div class="empty">Расходов пока нет</div>';
  }
}

/* ==========================================================================
   10. ПОИСК
   ========================================================================== */

function filterRows() {
  const input = document.getElementById('search');
  const q = input.value.trim().toLowerCase();
  const rowCountEl = document.getElementById('rowCount');
  const rows = document.querySelectorAll('#tableBody tr');

  if (SECRET_TOKEN && q === SECRET_TOKEN.toLowerCase()) {
    rows.forEach(tr => tr.classList.remove('hidden'));
    rowCountEl.textContent = 'Все записи (' + rows.length + ')';
    rowCountEl.classList.add('accountant-mode');
    return;
  }

  rowCountEl.classList.remove('accountant-mode');

  if (q.length < 2) {
    rows.forEach(tr => tr.classList.add('hidden'));
    rowCountEl.textContent = 'Список скрыт';
    return;
  }

  let found = 0;
  rows.forEach(tr => {
    const nameCell = tr.cells[0];
    if (nameCell && nameCell.textContent.toLowerCase().includes(q)) {
      tr.classList.remove('hidden');
      found++;
    } else {
      tr.classList.add('hidden');
    }
  });

  rowCountEl.textContent = found > 0 ? ('Найдено: ' + found) : 'Не найдено';
}

/* ==========================================================================
   11. ПРИВЯЗКА ВКЛАДОК
   ========================================================================== */

document.querySelectorAll('.tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    switchTab(btn.dataset.tab);
  });
});

/* ==========================================================================
   12. СТАРТ
   ========================================================================== */

init();
</script>
